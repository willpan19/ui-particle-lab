    const src = grp.customTex.image;
    if (src && src.width) {
      const side = Math.min(src.width, src.height) || 1;
      try {
        cx.drawImage(src, (src.width - side) / 2, (src.height - side) / 2, side, side, 0, 0, 48, 48);
      } catch (e) {
        cx.fillStyle = '#20242a'; cx.fillRect(0, 0, 48, 48);
      }
    } else {
      cx.fillStyle = '#20242a'; cx.fillRect(0, 0, 48, 48);
      cx.fillStyle = '#9fb0c8'; cx.font = '11px sans-serif'; cx.fillText('IMG', 12, 29);
    }
    ccell.appendChild(ccv);
    const ct = document.createElement('span');
    ct.textContent = 'Custom';
    ccell.appendChild(ct);
    wrap.appendChild(ccell);
  }

  const useBuiltin = !(grp && grp.customTex);
  Object.keys(TEX_GEN).forEach(function (k) {
    const cell = document.createElement('div');
    cell.className = 'texcell' + (useBuiltin && P.texKey === k ? ' sel' : '');
    const cv = document.createElement('canvas');
    cv.width = cv.height = 48;
    const c = cv.getContext('2d');
    c.drawImage(buildTextureCanvas(k), 0, 0, 48, 48);
    cell.appendChild(cv);
    const t = document.createElement('span');
    t.textContent = TEX_LABEL[k] || k;
    cell.appendChild(t);
    cell.addEventListener('click', function () {
      P.texKey = k;
      resetGroupTexture(grp);         /* 点内置格 = 清掉该组自定义状态，回到内置纹理 */
      applyTexture();
      buildTexGrid(body);
      onParamChange('texKey');
    });
    wrap.appendChild(cell);
  });
  body.appendChild(wrap);
  uiRefs.__texBody = body;
}

function buildGradient(body, wrap) {
  wrap.innerHTML = '';
  const bar = document.createElement('div');
  bar.className = 'gradbar';
  wrap.appendChild(bar);

  const list = document.createElement('div');
  list.className = 'gradlist';
  wrap.appendChild(list);

  const rebuild = function () {
    const stops = P.grad.slice().sort(function (a, b) { return a[0] - b[0]; });
    const parts = stops.map(function (s) {
      return s[1] + ' ' + (s[0] * 100).toFixed(1) + '%';
    });
    bar.style.background = 'linear-gradient(90deg,' + parts.join(',') + ')';
    list.innerHTML = '';
    stops.forEach(function (s, i) {
      const row = document.createElement('div');
      row.className = 'gradrow';
      const pos = document.createElement('input');
      pos.type = 'number'; pos.className = 'num'; pos.step = 0.01; pos.min = 0; pos.max = 1;
      pos.value = s[0].toFixed(2);
      const col = document.createElement('input');
      col.type = 'color'; col.className = 'col';
      col.value = s[1];
      const alp = document.createElement('input');
      alp.type = 'number'; alp.className = 'num'; alp.step = 0.01; alp.min = 0; alp.max = 1;
      alp.value = s[2].toFixed(2);
      row.appendChild(pos); row.appendChild(col); row.appendChild(alp);
      if (P.grad.length > 2) {
        const del = document.createElement('button');
        del.className = 'mini';
        del.textContent = '×';
        del.addEventListener('click', function () {
          P.grad.splice(P.grad.indexOf(s), 1);
          rebuild();
          onParamChange('grad');
        });
        row.appendChild(del);
      }
      pos.addEventListener('change', function () {
        s[0] = clamp(parseFloat(pos.value) || 0, 0, 1);
        rebuild(); onParamChange('grad');
      });
      col.addEventListener('input', function () {
        s[1] = col.value; rebuild(); onParamChange('grad');
      });
      alp.addEventListener('change', function () {
        s[2] = clamp(parseFloat(alp.value) || 0, 0, 1);
        rebuild(); onParamChange('grad');
      });
      list.appendChild(row);
    });
  };
  rebuild();

  const addBtn = document.createElement('button');
  addBtn.className = 'mini';
  addBtn.textContent = '+ Add Color Key';
  addBtn.addEventListener('click', function () {
    P.grad.push([0.5, '#ffffff', 1]);
    buildGradient(body, wrap);
    onParamChange('grad');
  });
  wrap.appendChild(addBtn);
}

function syncUI() {
  for (const key in uiRefs) {
    const r = uiRefs[key];
    if (!r) continue;
    if (r.type === 'num') {
      if (r.rng) r.rng.value = P[key];
      if (r.num) r.num.value = fmt(P[key], r.step);
    } else if (r.type === 'chk') {
      r.box.checked = !!P[key];
    } else if (r.type === 'sel') {
      r.sel.value = P[key];
    } else if (r.type === 'curve') {
      r.draw();
    } else if (r.type === 'color') {
      r.col.value = P[key];
      r.hex.value = (P[key] || '#ffffff').toUpperCase();
    }
  }
  if (uiRefs.__seed) uiRefs.__seed.value = P.randomSeed;
  if (uiRefs.__bursts) uiRefs.__bursts();
}

function onParamChange(key) {
  if (key === 'sizePreset') {
    if (SIZE_PRESETS[P.sizePreset]) {
      P.sizeCurve = SIZE_PRESETS[P.sizePreset].map(function (p) { return [p[0], p[1]]; });
      syncUI();
    }
  }
  if (key === 'texKey' || key === 'renderMode') applyTexture();
  if (key === 'texAlphaMode') {
    const nTex = rebuildAllCustomTextures();
    toast('Texture alpha mode: ' + (P.texAlphaMode || 'grayscale') + (nTex ? ' (' + nTex + ' custom texture rebuilt)' : ''));
  }
  if (key === 'shapeType') {
    /* 切形状时把厚度归位到该形状的默认值，避免上一个形状（甜甜圈）的内圈残留在场景里 */
    P.radiusThickness = (P.shapeType === 'donut') ? 0.9 : 1;
    if (typeof syncUI === 'function') syncUI();
  }
  applyMaterialParams();
  applyTransform();
  refreshInfoPanel();
  autosave();
  resetIfNeeded(key);
  /* 暂停状态下也要立刻看到改动：把当前组数据直接写进自己的 GPU 缓冲 */
  if (GROUPS.length) { saveGroupVars(GROUPS[gActive]); writeBuffers(); }
}

function resetIfNeeded(key) {
  const restart = ['maxParticles', 'shapeType', 'burstCount', 'randomSeed', 'bursts'];
  if (restart.indexOf(key) >= 0) resetSystem();
}

/* =====================================================================
   9. 视图控制（2D 锁定 / 3D / 重置）
   ===================================================================== */
const AXES_PRESET_2D = true;

function set2D(on) {
  view2D = on;
  if (on) {
    controls.enableRotate = false;
    controls.enablePan = true;
    controls.enableZoom = true;
    camera.up.set(0, 1, 0);
    /* 低 FOV + 拉远距离，视觉上接近正交投影，避免 2D 调参时被透视畸变干扰 */
    camera.fov = 20;
    camera.position.set(0, 0, 34);
    camera.updateProjectionMatrix();
    controls.target.set(0, 0, 0);
    controls.update();
    gridGroup.visible = !pureMode;
    document.getElementById('btnView2D').classList.add('on');
    document.getElementById('btnView3D').classList.remove('on');
    document.getElementById('viewstate').textContent = '2D view · straight onto the XY plane (rotation locked)';
  } else {
    controls.enableRotate = true;
    camera.up.set(0, 1, 0);
    camera.fov = 45;
    camera.position.set(7, 5.5, 11);
    camera.updateProjectionMatrix();
    controls.target.set(0, 0, 0);
    controls.update();
    document.getElementById('btnView3D').classList.add('on');
    document.getElementById('btnView2D').classList.remove('on');
    document.getElementById('viewstate').textContent = '3D perspective view (free rotation)';
  }
  resize();
}

function resetView() {
  if (view2D) {
    camera.fov = 20;
    camera.position.set(0, 0, 34);
  } else {
    camera.fov = 45;
    camera.position.set(7, 5.5, 11);
  }
  camera.updateProjectionMatrix();
  controls.target.set(0, 0, 0);
  controls.update();
}

function resize() {
  const w = Math.max(1, viewport.clientWidth | 0);
  const h = Math.max(1, viewport.clientHeight | 0);
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

/* 容器尺寸变化（侧栏滚动条出现、窗口缩放、分屏）都重算画布，防止溢出遮挡参数面板 */
if (typeof ResizeObserver !== 'undefined') {
  new ResizeObserver(function () { resize(); }).observe(viewport);
}

function projectPoint(v3) {
  const p = v3.clone().project(camera);
  const w = viewport.clientWidth, h = viewport.clientHeight;
  return {
    x: (p.x * 0.5 + 0.5) * w,
    y: (-p.y * 0.5 + 0.5) * h,
    z: p.z
  };
}

/* 左上信息面板：显示 Transform 数值，并允许直接拖动 / 输入 */
function refreshInfoPanel() {
  const set = function (id, v) {
    const el = document.getElementById(id);
    if (el && document.activeElement !== el) el.value = Number(v).toFixed(2);
  };
  set('iposX', P.posX); set('iposY', P.posY); set('iposZ', P.posZ);
  set('irotX', P.rotX); set('irotY', P.rotY); set('irotZ', P.rotZ);
  set('isclX', P.scaleX); set('isclY', P.scaleY); set('isclZ', P.scaleZ);
  document.getElementById('iname').textContent = 'UI_Particle';
}

/* =====================================================================
   10. 导出 Unity C#
   ===================================================================== */
function f(v, d) {
  const n = Number(v);
  return (isFinite(n) ? n : 0).toFixed(d === undefined ? 4 : d);
}

function gradientCs(tab, varName) {
  const stops = P.grad.slice().sort(function (a, b) { return a[0] - b[0]; });
  const L = [];
  L.push(tab + 'var ' + varName + ' = new Gradient();');
  L.push(tab + varName + '.mode = GradientMode.Blend;');
  L.push(tab + 'var ' + varName + 'CK = new GradientColorKey[] {');
  const cks = stops.map(function (s) {
    const c = s[1] ? s[1].replace('#', '') : 'ffffff';
    return tab + tab + 'new GradientColorKey(ColorUtil("' + c + '"), ' + f(s[0], 3) + 'f)';
  });
  L.push(cks.join(',\n'));
  L.push(tab + '};');
  L.push(tab + 'var ' + varName + 'AK = new GradientAlphaKey[] {');
  const aks = stops.map(function (s) {
    return tab + tab + 'new GradientAlphaKey(' + f(s[2], 3) + 'f, ' + f(s[0], 3) + 'f)';
  });
  L.push(aks.join(',\n'));
  L.push(tab + '};');
  L.push(tab + varName + '.SetKeys(' + varName + 'CK, ' + varName + 'AK);');
  return L.join('\n');
}

function curveCs(tab, varName, pts) {
  const L = [];
  L.push(tab + 'var ' + varName + ' = new AnimationCurve(new Keyframe[] {');
  const ks = pts.map(function (q) {
    return tab + tab + 'new Keyframe(' + f(q[0], 3) + 'f, ' + f(q[1], 3) + 'f)';
  });
  L.push(ks.join(',\n'));
  L.push(tab + '});');
  L.push(tab + varName + '.preWrapMode = WrapMode.Clamp;');
  L.push(tab + varName + '.postWrapMode = WrapMode.Clamp;');
  return L.join('\n');
}

/* ---------- 自动存档（localStorage） ---------- */
const AUTOSAVE_KEY = 'uiplab.autosave.v1';
let autosaveTimer = 0;
function autosave() {
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(function () {
    try { localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(collectParams())); } catch (e) {}
  }, 400);
}
function readAutosave() {
  try {
    const s = localStorage.getItem(AUTOSAVE_KEY);
    return s ? JSON.parse(s) : null;
  } catch (e) { return null; }
}
function applyParams(obj) {
  const np = normParams(obj || {});
  const cg = GROUPS[gActive];
  if (cg) { cg.P = np; }
  P = cg ? cg.P : np;
  normalizeBursts();
  buildUI();
  applyTexture();
  applyMaterialParams();
  applyTransform();
  refreshInfoPanel();
  resetSystem();
  commitGroup();
  syncUI();
  syncGroupUI();
}

function collectParams() {
  const o = {};
  for (const k in DEFAULT) o[k] = P[k];
  return o;
}

function copyText(text, okMsg) {
  const done = function () { toast(okMsg || 'Copied to clipboard'); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(function () { fallbackCopy(text); done(); });
  } else {
    fallbackCopy(text); done();
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) { }
  document.body.removeChild(ta);
}

function showModal(title, text) {
  const modal = document.getElementById('modal');
  document.getElementById('modaltitle').textContent = title;
  document.getElementById('modalbody').value = text;
  document.getElementById('btnModalCopy').onclick = function () { copyText(text, 'Copied'); };
  modal.classList.add('show');
}

function download(name, text) {
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
}

/* =====================================================================
   12. 事件绑定
   ===================================================================== */
const presetSel = document.getElementById('preset');
const fileInput = document.createElement('input');
fileInput.type = 'file';
fileInput.accept = 'image/*';
fileInput.style.display = 'none';
document.body.appendChild(fileInput);

function fillPresetSelect() {
  presetSel.innerHTML = '';
  const o0 = document.createElement('option');
  o0.value = '';
  o0.textContent = '— 选择 UI 粒子预置（仅 UI 特效，不含技能特效）—';
  presetSel.appendChild(o0);

  PRESET_GROUP_ORDER.forEach(function (g) {
    const grp = document.createElement('optgroup');
    grp.label = g;
    for (const id in PRESETS) {
      if (PRESET_GROUP[id] !== g) continue;
      const op = document.createElement('option');
      op.value = id;
      op.textContent = PRESETS[id].name;
      grp.appendChild(op);
    }
    if (grp.children.length) presetSel.appendChild(grp);
  });

  /* 兜底：未登记分组的预设 */
  for (const id in PRESETS) {
    if (PRESET_GROUP[id]) continue;
    const op = document.createElement('option');
    op.value = id;
    op.textContent = PRESETS[id].name;
    presetSel.appendChild(op);
  }
}

function applyPreset(id) {
  const pre = PRESETS[id];
  if (!pre) return;
  const np = deepClone(Object.assign({}, DEFAULT, pre.data));
  if (!np.sizeCurve) np.sizeCurve = SIZE_PRESETS[np.sizePreset] || SIZE_PRESETS.const;
  if (!np.velSpeedCurve || !np.velSpeedCurve.length) np.velSpeedCurve = [[0, 1], [1, 1]];
  if (typeof np.velSpeedMod !== 'number') np.velSpeedMod = 1;

  /* 关键修复：预设参数必须真正写进“当前组”，否则下一帧 loadGroupVars/commitGroup
     会把该组旧参数还原回去，所有预设看起来就变成同一种粒子了 */
  const cg = GROUPS[gActive];
  if (cg) {
    cg.P = normParams(np);
    resetGroupTexture(cg);
    cg.tex = null;
    cg.texKey = '';
    P = cg.P;
  } else {
    P = normParams(np);
  }
  /* 该组的自定义贴图已由 resetGroupTexture 清空，回到预设内置纹理 */
  normalizeBursts();
  buildUI();
  applyTexture();
  applyMaterialParams();
  applyTransform();
  refreshInfoPanel();
  resetSystem();
  refreshAllGroupVisuals();
  commitGroup();
  syncUI();
  syncGroupUI();
  paused = false;
  document.getElementById('btnPause').textContent = 'Pause';
  toast('Loaded: ' + pre.name);
}

document.getElementById('btnReplay').addEventListener('click', function () {
  resetSystem();
  paused = false;
  document.getElementById('btnPause').textContent = 'Pause';
});

document.getElementById('btnPause').addEventListener('click', function () {
  paused = !paused;
  this.textContent = paused ? 'Resume' : 'Pause';
});

/* ---------------- 纯净模式：只留纯色背景 + 粒子 ---------------- */
function applyPure(on) {
  pureMode = !!on;
  document.body.classList.toggle('pure', pureMode);
  gridGroup.visible = !pureMode;
  const b = document.getElementById('btnPure');
  if (b) b.classList.toggle('on', pureMode);
  toast(pureMode ? 'Pure mode: grid / XYZ axes / left panel hidden' : 'Grid and XYZ axes restored');
}

document.getElementById('btnPure').addEventListener('click', function () {
  applyPure(!pureMode);
});

/* ---------------- 导出当前暂停帧 PNG ---------------- */
function shotPNG(withBg) {
  const wasPaused = paused;
  paused = true;
  const pb = document.getElementById('btnPause');
  if (pb) pb.textContent = 'Resume';

  const bg = document.getElementById('bgColor').value || '#0b0c0e';
  if (withBg) {
    renderer.setClearColor(new THREE.Color(bg), 1);
  } else {
    renderer.setClearColor(0x000000, 0);
  }
  renderer.render(scene, camera);

  let url = '';
  try {
    url = renderer.domElement.toDataURL('image/png');
  } catch (err) {
    renderer.setClearColor(0x000000, 0);
    toast('Export failed: ' + err.message + ' (try a smaller window size and export again)');
    return;
  }
  renderer.setClearColor(0x000000, 0);
  if (!url || url.length < 200) {
    toast('Export failed: the frame is empty — make sure the particles are visible');
    return;
  }

  const d = new Date();
  const pad = function (n) { return (n < 10 ? '0' : '') + n; };
  const name = 'ui_particle_' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) +
    '_' + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds()) + '.png';

  const a = document.createElement('a');
  a.download = name;
  a.href = url;
  a.click();

  toast('PNG exported' + (withBg ? ' (with flat background)' : ' (transparent)') + (wasPaused ? '' : ' — the frame was paused'));
}

document.getElementById('btnShot').addEventListener('click', function (e) {
  shotPNG(!!e.shiftKey);
});

document.getElementById('bgColor').addEventListener('input', function () {
  viewport.style.background = this.value;
});

document.getElementById('btnCopyCs').addEventListener('click', function () {
  const cs = buildCSharp();
  copyText(cs, 'C# script copied (save it as Assets/Editor/ParticlePresetApplier.cs)');
});

document.getElementById('btnCopyJson').addEventListener('click', function () {
  copyText(JSON.stringify(collectParams(), null, 2), 'JSON parameters copied');
});

document.getElementById('btnDownloadCs').addEventListener('click', function () {
  download('ParticlePresetApplier.cs', buildCSharp());
  toast('Downloaded ParticlePresetApplier.cs');
});

document.getElementById('btnHelp').addEventListener('click', function () {
  showModal('How to copy / paste particle parameters into Unity', UNITY_NOTE);
});

document.getElementById('btnImport').addEventListener('click', function () {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json';
  inp.onchange = function () {
    const fr = new FileReader();
    fr.onload = function () {
      try {
        const obj = JSON.parse(fr.result);
        P = Object.assign({}, DEFAULT, obj);
        buildUI();
        applyTexture();
        applyMaterialParams();
        applyTransform();
        refreshInfoPanel();
        resetSystem();
        toast('Preset imported');
      } catch (e) {
        toast('Failed to parse JSON');
      }
    };
    fr.readAsText(inp.files[0]);
  };
  inp.click();
});

document.getElementById('btnExport').addEventListener('click', function () {
  download('ui-particle-preset.json', JSON.stringify(collectParams(), null, 2));
  toast('JSON exported');
});

document.getElementById('btnView2D').addEventListener('click', function () { set2D(true); });
document.getElementById('btnView3D').addEventListener('click', function () { set2D(false); });
document.getElementById('btnResetView').addEventListener('click', function () { resetView(); });

presetSel.addEventListener('change', function () {
  if (presetSel.value) applyPreset(presetSel.value);
});

fileInput.addEventListener('change', function () {
  const f0 = fileInput.files[0];
  fileInput.value = '';                 /* 允许重复上传同一张图 */
  if (!f0) return;
  /* 关键：上传只作用于当前选中的组，写进该组自己的 assets.uniforms 与组内自定义纹理标记 */
  const target = GROUPS[gActive];
  if (!target) return;
  const fr = new FileReader();
  fr.onload = function () {
    const img = new Image();
    img.onload = function () {
      target.customSrc = img;            /* 保留原始图片，切换 texAlphaMode 时按新模式重算 */
      const tex = buildCustomTexture(img, (target.P && target.P.texAlphaMode) || 'grayscale');
      if (target.customTex && target.customTex.dispose) target.customTex.dispose();
      target.customTex = tex;           /* 组级自定义贴图标记，其它组不受影响 */
      applyTextureTo(target);           /* 只刷新该组的 uTex / uUseTex */
      if (uiRefs.__texBody) buildTexGrid(uiRefs.__texBody);
      toast('Custom texture applied to ' + target.name);
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(f0);
});

document.getElementById('modal').addEventListener('click', function (e) {
  if (e.target === this) this.classList.remove('show');
});
document.getElementById('modalclose').addEventListener('click', function () {
  document.getElementById('modal').classList.remove('show');
});

window.addEventListener('resize', resize);

/* 左上信息面板的键盘输入 */
(function bindInfoInputs() {
  const pairs = [
    ['iposX', 'posX', 0.05], ['iposY', 'posY', 0.05], ['iposZ', 'posZ', 0.05],
    ['irotX', 'rotX', 1], ['irotY', 'rotY', 1], ['irotZ', 'rotZ', 1],
    ['isclX', 'scaleX', 0.05], ['isclY', 'scaleY', 0.05], ['isclZ', 'scaleZ', 0.05]
  ];
  pairs.forEach(function (it) {
    const el = document.getElementById(it[0]);
    if (!el) return;
    el.addEventListener('change', function () {
      const v = parseFloat(el.value);
      if (isFinite(v)) {
        P[it[1]] = v;
        applyTransform();
        syncUI();
        refreshInfoPanel();
      } else {
        refreshInfoPanel();
      }
    });
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { el.dispatchEvent(new Event('change')); el.blur(); }
    });
    el.addEventListener('focus', function () { el.select(); });
  });
})();

/* =====================================================================
   13. 主循环
   ===================================================================== */
let lastT = performance.now();

let stepAcc = 0;
const FIXED_STEP = 1 / 60;

function loop(now) {
  requestAnimationFrame(loop);
  const raw = Math.min(0.25, (now - lastT) / 1000);
  lastT = now;

  if (!paused) {
    /* 固定步长积分：掉帧/切后台后表现与帧率解耦（等价 Unity Fixed Timestep），
       单帧最多补 6 步，避免长时间挂起后一次性追帧卡死 */
    stepAcc += raw;
    let guard = 0;
    while (stepAcc >= FIXED_STEP && guard < 6) {
      simulateAll(FIXED_STEP);
      stepAcc -= FIXED_STEP;
      guard++;
    }
    if (stepAcc > FIXED_STEP * 6) stepAcc = 0;
    /* 只有存在正在播放的组时才上传缓冲：全部取消勾选后画面彻底静止，不再有每帧抖动 */
    if (anyGroupPlaying()) uploadAll();
  }
  controls.update();
  refreshInfoPanel();
  renderer.render(scene, camera);
}

/* 把某个组的运行状态装载进全局工作区（不切换 gActive，避免面板/选中态被来回改） */
function loadGroupVars(g) {
  P = g.P;
  particles = g.particles;
  pool = g.pool;
  emitAcc = g.emitAcc;
  simTime = g.simTime;
  sysElapsed = g.sysElapsed;
  burstPhase = g.burstPhase;
  seedCounter = g.seedCounter;
  rng = g.rng;
  const a = g.assets;
  quadGeo = a.geo;
  iPos = a.iPos; iSize = a.iSize; iColor = a.iColor; iRot = a.iRot; iVel = a.iVel;
  uniforms = a.uniforms;
  mat = a.mat;
  particleMesh = a.mesh;
}

function saveGroupVars(g) {
  g.particles = particles;
  g.pool = pool;
  g.emitAcc = emitAcc;
  g.simTime = simTime;
  g.sysElapsed = sysElapsed;
  g.burstPhase = burstPhase;
  g.seedCounter = seedCounter;
  g.rng = rng;
}

/* 多组同步：Playback 勾选的每个组各自独立推进模拟，互不干扰；未勾选的组完全静止 */
function anyGroupPlaying() {
  if (!GROUPS.length) return true;
  for (let i = 0; i < GROUPS.length; i++) if (GROUPS[i].play) return true;
  return false;
}

function simulateAll(dt) {
  if (!GROUPS.length) { updateSystem(dt); return; }
  const back = GROUPS[gActive] || GROUPS[0];
  saveGroupVars(back);
  for (let i = 0; i < GROUPS.length; i++) {
    const g = GROUPS[i];
    /* 严格按播放勾选：未勾选的组（含当前选中组）一律不推进，避免"只播一个"的假同步 */
    if (!g.play) continue;
    loadGroupVars(g);
    updateSystem(dt);
    saveGroupVars(g);
  }
  loadGroupVars(back);
}

/* 每个组都写自己的 GPU 缓冲，多组才能同时真实显示 */
function uploadAll() {
  if (!GROUPS.length) { writeBuffers(); return; }
  const back = GROUPS[gActive] || GROUPS[0];
  for (let i = 0; i < GROUPS.length; i++) {
    loadGroupVars(GROUPS[i]);
    writeBuffers();
  }
  loadGroupVars(back);
}

/* =====================================================================
   14. 启动
   ===================================================================== */
function boot() {
  fillPresetSelect();
  if (!GROUPS.length) { addGroup('Particle 1', P); bindGroup(0); }
  bindGroupPanelButtons();
  const saved = readAutosave();
  if (saved) {
    applyParams(saved);
    toast('Last session parameters restored');
  } else {
    applyParams(P);
    applyPreset('reward');
    presetSel.value = 'reward';
  }
  refreshAllGroupVisuals();
  syncGroupUI();
  resize();
  set2D(true);
  document.getElementById('loading').style.display = 'none';
  requestAnimationFrame(loop);
}

boot();
</script>
