<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UI Particle Lab · Unity Particle System · UI Only</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background:#141414; color:#d0d0d0; font-size:13px; -webkit-font-smoothing:antialiased;
  }
  #app { display:flex; height:100vh; }

  /* ---------- 视口 ---------- */
  #viewport { flex:1; position:relative; background:#0b0c0e; min-width:0; }
  #viewport canvas { display:block; }
  #viewstate {
    position:absolute; right:14px; top:52px; font-size:11.5px; color:#5f7f96;
    font-family:ui-monospace, Consolas, monospace; pointer-events:none;
    background:rgba(0,0,0,.35); padding:3px 8px; border-radius:3px;
  }
  #hint {
    position:absolute; left:14px; bottom:12px; font-size:11.5px; color:#4a4a4a;
    pointer-events:none; font-family:ui-monospace, Consolas, monospace;
  }
  #viewtools { position:absolute; right:14px; top:12px; display:flex; gap:7px; z-index:5; }
  #viewtools button {
    background:rgba(40,40,40,.94); border:1px solid #434343; color:#b0b0b0;
    padding:7px 15px; font-size:12px; border-radius:4px; cursor:pointer;
    font-family:inherit; backdrop-filter:blur(4px); transition:all .12s;
  }
  #viewtools button:hover { background:#3a3a3a; color:#e0e0e0; }
  #viewtools button.on { background:#2d5f8a; border-color:#5aa0d8; color:#f0f8ff; }

  /* ---------- 左上：物体信息面板（Transform） ---------- */
  #infopanel {
    position:absolute; left:14px; top:12px; z-index:6;
    background:rgba(24,26,29,.93); border:1px solid #3a3f45; border-radius:6px;
    padding:11px 13px 10px; min-width:236px; backdrop-filter:blur(8px);
    box-shadow:0 6px 24px rgba(0,0,0,.5);
  }
  #infopanel .iphead {
    display:flex; align-items:center; gap:7px; margin-bottom:9px;
    padding-bottom:8px; border-bottom:1px solid #33383e;
  }
  #infopanel .dot { width:8px; height:8px; border-radius:50%; background:#5aa0d8;
    box-shadow:0 0 7px #5aa0d8; flex:0 0 auto; }
  #infopanel #iname {
    font-size:12.5px; font-weight:600; color:#dce6ee;
    font-family:ui-monospace, Consolas, monospace; letter-spacing:.3px;
  }
  #infopanel .iptag {
    margin-left:auto; font-size:10px; color:#5c6870; letter-spacing:.6px;
    text-transform:uppercase;
  }
  #infopanel .iprow { display:flex; align-items:center; gap:6px; margin-bottom:5px; }
  #infopanel .iplab {
    flex:0 0 34px; font-size:11px; color:#7b858d;
    font-family:ui-monospace, Consolas, monospace;
  }
  #infopanel .iptri { display:flex; gap:4px; flex:1; }
  #infopanel .ipcell { display:flex; align-items:center; gap:3px; flex:1; min-width:0; }
  #infopanel .ipaxis {
    font-size:10px; font-family:ui-monospace, Consolas, monospace; width:9px;
  }
  #infopanel .ipaxis.x { color:#d06a6a; }
  #infopanel .ipaxis.y { color:#6ec06e; }
  #infopanel .ipaxis.z { color:#6a9ed0; }
  #infopanel input.ipin {
    flex:1; min-width:0; width:100%; background:#111417; border:1px solid #3a4048;
    border-radius:3px; color:#9ed2f0; font-size:11.5px; padding:3px 4px;
    text-align:right; font-family:ui-monospace, Consolas, monospace; outline:none;
    -moz-appearance:textfield;
  }
  #infopanel input.ipin:focus { border-color:#5aa0d8; background:#171b1f; }
  #infopanel input.ipin::-webkit-outer-spin-button,
  #infopanel input.ipin::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  #infopanel .ipfoot { font-size:10px; color:#4e585f; margin-top:7px; line-height:1.5; }

  /* ---------- 侧栏 ---------- */
  #sidebar {
    width:412px; background:#1a1a1a; border-left:1px solid #2e2e2e;
    display:flex; flex-direction:column; min-height:0; flex:0 0 auto;
  }
  #topbar {
    padding:12px 13px; border-bottom:1px solid #2e2e2e;
    display:flex; flex-direction:column; gap:9px; background:#1e1e1e;
  }
  #topbar .line { display:flex; gap:8px; align-items:center; }
  #preset {
    flex:1; font-size:12.5px; background:#262626; color:#d4d4d4;
    border:1px solid #3f3f3f; border-radius:4px; padding:7px 8px; cursor:pointer;
    font-family:inherit; outline:none; min-width:0;
  }
  #preset:focus { border-color:#5aa0d8; }

  #groups { flex:1; overflow-y:auto; padding:11px 13px 80px; }
  #groups::-webkit-scrollbar { width:10px; }
  #groups::-webkit-scrollbar-thumb { background:#3f3f3f; border-radius:5px; }
  #groups::-webkit-scrollbar-track { background:#161616; }

  /* ---------- 组件卡片 ---------- */
  .sec {
    background:#212121; border:1px solid #343434; border-radius:6px;
    margin-bottom:10px; overflow:hidden;
  }
  .sec > .head {
    display:flex; align-items:center; gap:9px;
    padding:12px 13px; cursor:pointer; user-select:none;
    background:#2b2b2b; position:relative; transition:background .12s;
  }
  .sec > .head:hover { background:#333; }
  .sec > .head::before {
    content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:#4f9fd8;
  }
  .sec.closed > .head::before { background:#3d4349; }
  .sec > .head .arrow {
    font-size:11px; color:#7f8b95; flex:0 0 auto; width:11px;
    transition:transform .14s; line-height:1;
  }
  .sec.closed > .head .arrow { transform:rotate(-90deg); }
  .sec > .head .title {
    font-size:14px; font-weight:600; color:#e6e6e6; letter-spacing:.4px;
  }
  .sec.closed > .head .title { color:#b9b9b9; }
  .sec > .head .en {
    margin-left:auto; font-size:10.5px; color:#6d7880;
    font-family:ui-monospace, Consolas, monospace; letter-spacing:.4px;
    flex:0 0 auto; max-width:56%; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap;
  }
  .sec > .body { padding:12px 13px 14px; }
  .sec.closed > .body { display:none; }

  .subhead {
    font-size:11px; color:#8a949c; letter-spacing:.6px;
    margin:14px 0 8px; padding-bottom:5px;
    border-bottom:1px solid #343434; font-weight:600;
  }
  .subhead:first-child { margin-top:0; }

  /* ---------- 行 ---------- */
  .row { display:flex; align-items:center; margin-bottom:8px; gap:9px; }
  .row > label {
    flex:0 0 104px; color:#a8b0b8; font-size:12px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .row input[type=range] {
    flex:1; height:18px; -webkit-appearance:none; background:transparent; min-width:0;
  }
  .row input[type=range]::-webkit-slider-runnable-track {
    height:4px; background:#3d3d3d; border-radius:2px;
  }
  .row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; width:13px; height:13px; border-radius:50%;
    background:#5aa0d8; margin-top:-4.5px; cursor:pointer;
    box-shadow:0 0 0 2px rgba(90,160,216,.22);
  }
  .row input[type=number], .row .num {
    flex:0 0 68px; width:68px; background:#141414; border:1px solid #3f3f3f;
    border-radius:4px; color:#7cc4f0; font-size:12px; padding:4px 6px;
    text-align:right; font-family:ui-monospace, Consolas, monospace;
    outline:none; -moz-appearance:textfield; transition:border-color .1s;
  }
  .row input[type=number]:hover { border-color:#565656; }
  .row input[type=number]:focus { border-color:#5aa0d8; background:#1c1c1c; }
  .row input[type=number]::-webkit-outer-spin-button,
  .row input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }

  .row select, .row input[type=text], .row .sel {
    flex:1; min-width:0; font-size:12px; background:#2a2a2a; color:#d2d2d2;
    border:1px solid #434343; border-radius:4px; padding:5px 7px; cursor:pointer;
    font-family:inherit; outline:none;
  }
  .row select:focus, .row input[type=text]:focus { border-color:#5aa0d8; }
  .row input.col {
    flex:0 0 44px; width:44px; height:26px; padding:2px; cursor:pointer;
    background:#2a2a2a; border:1px solid #434343; border-radius:4px;
  }
  .row .hexin { flex:0 0 86px; width:86px; text-align:center; letter-spacing:.5px; }

  .chk { display:flex; align-items:center; gap:8px; cursor:pointer; font-size:12px; }
  .chk input { accent-color:#5aa0d8; cursor:pointer; width:14px; height:14px; }
  .chk span { color:#a8b0b8; }

  /* 三轴 */
  .row.vec { align-items:center; }
  .vec3 { display:flex; gap:7px; flex:1; min-width:0; }
  .axiscell {
    display:flex; align-items:center; gap:4px; flex:1; min-width:0;
    background:#161616; border:1px solid #3a3a3a; border-radius:4px; padding:1px 4px;
  }
  .axiscell .axis {
    font-size:10px; font-family:ui-monospace, Consolas, monospace;
    flex:0 0 auto; font-weight:600;
  }
  .axiscell .axis.ax { color:#d07070; }
  .axiscell .axis.ay { color:#6fbf6f; }
  .axiscell .axis.az { color:#6b9fd6; }
  .axiscell input {
    flex:1; min-width:0; width:100%; background:transparent; border:none;
    color:#9ed2f0; font-size:12px; padding:4px 0; text-align:right;
    font-family:ui-monospace, Consolas, monospace; outline:none;
    -moz-appearance:textfield;
  }
  .axiscell input::-webkit-outer-spin-button,
  .axiscell input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  .axiscell:focus-within { border-color:#5aa0d8; }

  button {
    font-size:12px; padding:6px 11px; background:#2f2f2f; color:#d0d0d0;
    border:1px solid #474747; border-radius:4px; cursor:pointer; font-family:inherit;
    white-space:nowrap; transition:background .1s;
  }
  button:hover { background:#3d3d3d; border-color:#5a5a5a; }
  button:active { background:#282828; }
  button.primary { background:#2d5f8a; border-color:#4585b8; color:#eaf4fc; }
  button.primary:hover { background:#37719f; }
  button.small { padding:6px 10px; font-size:11.5px; }
  .btnrow { display:flex; gap:8px; margin:10px 0 2px; flex-wrap:wrap; }
  .btnrow .mini { flex:1; min-width:88px; }
  button.mini { font-size:11.5px; padding:6px 9px; }

  .texgrid { display:grid; grid-template-columns:repeat(6, 1fr); gap:7px; margin:8px 0 4px; }
  .texcell {
    border:1px solid #383838; border-radius:4px; background:#0f0f0f;
    cursor:pointer; overflow:hidden; display:flex; flex-direction:column;
    align-items:center; padding:3px 2px 2px; transition:all .1s;
  }
  .texcell:hover { border-color:#606060; background:#171717; }
  .texcell.sel { border-color:#5aa0d8; box-shadow:0 0 0 1px #5aa0d8 inset; background:#15202a; }
  .texcell canvas { width:100%; height:auto; display:block; }
  .texcell span {
    font-size:9px; color:#7d858c; margin-top:2px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; max-width:100%;
  }
  .texcell.sel span { color:#9ed2f0; }

  .gradwrap { margin-top:6px; }
  .gradbar {
    height:26px; border:1px solid #444; border-radius:4px; margin-bottom:6px;
  }
  .gradlist { display:flex; flex-direction:column; gap:5px; }
  .gradrow { display:flex; gap:6px; align-items:center; }
  .gradrow .num { flex:0 0 62px; width:62px; }
  .gradrow .col { flex:0 0 40px; width:40px; height:24px; padding:2px; background:#2a2a2a;
    border:1px solid #434343; border-radius:4px; cursor:pointer; }
  .gradrow button { flex:0 0 26px; padding:3px 0; text-align:center; }

  .tip {
    font-size:11px; color:#78828a; line-height:1.7; margin-top:9px;
    padding:8px 10px; background:#1b1b1b; border-left:2px solid #40505c;
    border-radius:3px;
  }

  #toast {
    position:fixed; left:50%; bottom:36px; transform:translateX(-50%) translateY(16px);
    background:#2d5f8a; color:#eaf4fc; padding:11px 24px; border-radius:4px;
    font-size:12.5px; opacity:0; pointer-events:none; transition:all .22s;
    box-shadow:0 5px 22px rgba(0,0,0,.6); z-index:500; max-width:70vw;
  }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  #modal {
    position:fixed; inset:0; background:rgba(0,0,0,.78); display:none;
    align-items:center; justify-content:center; z-index:400; padding:18px;
  }
  #modal.show { display:flex; }
  #modalbox {
    background:#1c1c1c; border:1px solid #3d3d3d; border-radius:6px;
    width:min(1280px, 97vw); height:min(88vh,100%); display:flex; flex-direction:column;
    overflow:hidden; box-shadow:0 12px 44px rgba(0,0,0,.65);
  }
  #modalhead {
    padding:14px 18px; border-bottom:1px solid #303030; display:flex;
    align-items:center; gap:10px; background:#212121;
  }
  #modalhead h2 { font-size:16px; font-weight:600; color:#e2e2e2; flex:1; }
  #modalbody {
    flex:1; overflow:auto; padding:22px 26px; font-family:ui-monospace, Consolas, monospace;
    font-size:15px; line-height:2.05; color:#cdd5dd; background:#161616;
    border:none; outline:none; resize:none; width:100%;
  }
  #modalbody::-webkit-scrollbar { width:10px; height:10px; }
  #modalbody::-webkit-scrollbar-thumb { background:#3f3f3f; border-radius:5px; }

  /* 固定值锁 + 数值拖拽 */
  .row.locked label { color:#8fd0ff; }
  .lockbtn {
    margin-left:6px; width:19px; height:15px; padding:0; line-height:13px;
    font-size:10px; vertical-align:middle; background:#2a2a2a;
    border:1px solid #3f3f3f; color:#8a8a8a; border-radius:3px; cursor:pointer;
  }
  .lockbtn:hover { color:#cfe6ff; border-color:#5a7a99; }
  .row.locked .lockbtn { color:#7fd0ff; border-color:#4a7fa8; background:#243040; }
  .burstbox{display:flex;flex-direction:column;gap:6px;margin:2px 0 6px}
.brow{display:flex;align-items:center;gap:6px}
.bcell{display:flex;align-items:center;gap:4px;font-size:11px;color:#9fb0c8;flex:1;min-width:0}
.bcell .num{width:100%;min-width:0}
.brow .mini{padding:2px 8px}
body.scrubbing, body.scrubbing * { cursor:ew-resize !important; user-select:none !important; }

  #loading {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:#0b0c0e; color:#555; font-size:12.5px; z-index:10;
  }

  /* ============================================================
     可读性增强：分类标题 / 行距 / 数值输入框（覆盖上方默认值）
     ============================================================ */
  #sidebar { width: 440px; }
  #topbar { padding: 13px 15px; gap: 10px; }
  #groups { padding: 12px 15px 96px; counter-reset: secIdx; }

  .sec {
    margin-bottom: 14px; border-radius: 8px; border: 1px solid #3c3c3c;
    box-shadow: 0 1px 0 rgba(255,255,255,.02);
  }
  .sec > .head { padding: 13px 14px; background: #292929; }
  .sec > .head .title { font-size: 15px; font-weight: 700; color: #f2f2f2; letter-spacing: .6px; }
  .sec > .head .title::before {
    counter-increment: secIdx;
    content: counter(secIdx) " · ";
    color: #5aa0d8; font-weight: 700;
  }
  .sec > .head .en { font-size: 10.5px; color: #7c868e; letter-spacing: .5px; }
  .sec > .body { padding: 14px 14px 16px; background: #1f1f1f; }

  .subhead {
    font-size: 12px; color: #9fabb6; letter-spacing: .9px;
    margin: 18px 0 10px; padding-bottom: 6px;
    border-bottom: 1px solid #3a3a3a; font-weight: 700;
  }
  .subhead:first-child { margin-top: 0; }

  .row { margin-bottom: 10px; gap: 10px; min-height: 27px; }
  .row > label { flex: 0 0 114px; font-size: 12.5px; color: #c6cfd7; }
  .row input[type=number], .row .num {
    flex: 0 0 78px; width: 78px; font-size: 12.5px; padding: 5px 7px; color: #8ed0ff;
  }
  .row select, .row input[type=text], .row .sel { font-size: 12.5px; padding: 6px 8px; }
  .row input.col { flex: 0 0 48px; width: 48px; height: 28px; }
  .chk { font-size: 12.5px; }
  .chk span { color: #c6cfd7; }
  .axiscell input { font-size: 12px; }

  /* ============================================================
     布局修复：canvas 位图尺寸大于容器导致覆盖右侧参数面板
     ============================================================ */
  html, body { height: 100%; margin: 0; overflow: hidden; }
  #app { overflow: hidden; }
  #viewport {
    overflow: hidden; position: relative; min-width: 0;
    flex: 1 1 auto; background: #0b0c0e;
  }
  #viewport canvas {
    display: block; width: 100% !important; height: 100% !important;
    position: absolute !important; left: 0 !important; top: 0 !important;
    z-index: 0 !important;
  }
  /* 浮层必须压住 canvas，否则会被 3D 画面遮挡 */
  #viewstate, #hint, #loading { z-index: 4; }
  #sidebar {
    position: relative; z-index: 30;
    flex: 0 0 440px; width: 440px;
  }

  /* 背景色取色器 */
  #viewtools input[type=color] {
    width: 34px; height: 30px; padding: 2px; cursor: pointer;
    background: rgba(40,40,40,.94); border: 1px solid #434343; border-radius: 4px;
  }

  /* ============================================================
     单一长面板：取消折叠卡片，只用分组标题区隔
     英文主标题（大写等宽）+ 中文副标题
     ============================================================ */
  #groups { padding: 2px 16px 90px; }

  .sec {
    background: none; border: none; border-radius: 0;
    margin: 0; box-shadow: none; overflow: visible;
  }
  .sec > .head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    padding: 20px 0 7px; background: none; cursor: default; user-select: none;
    border-bottom: 1px solid #3a3a3a;
  }
  .sec > .head:hover { background: none; }
  .sec > .head::before { display: none; }
  .sec > .head .arrow { display: none; }
  /* 分区标题：英文为主标题（大写、等宽、大号高亮），中文为右侧辅助小字 */
  .sec > .head .title {
    font-size: 15px; font-weight: 700; color: #f5f8fb;
    letter-spacing: 1.9px; text-transform: uppercase;
    font-family: ui-monospace, Consolas, monospace;
  }
  .sec > .head .title::before { counter-increment: none; content: none; }
  .sec > .head .en { display: none; }
  .sec > .head .cn {
    font-size: 10.5px; line-height: 1; color: #69757f; letter-spacing: .6px;
    flex: 0 0 auto; margin-left: auto; font-weight: 500; text-transform: none;
    font-family: "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
  }
  .sec > .body { padding: 13px 0 8px; background: none; }
  .sec.closed > .body { display: block; }

  /* 纯净模式：只留纯色背景 + 粒子 */
  body.pure #infopanel,
  body.pure #viewstate,
  body.pure #hint { display: none !important; }

/* ---------- 曲线编辑控件 ---------- */
.row.curve { align-items: flex-start; }
.curvebox { background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.13);
  border-radius: 7px; line-height: 0; overflow: hidden; }
.curvecv { display: block; border-radius: 7px; cursor: crosshair; }
.curvehint { font-size: 11px; color: #7d8a99; margin-top: 4px; }

  /* ---------- 左侧：Particle Groups / Playback ---------- */
  #hierarchy {
    width: 196px; flex: none; background: #17191c; border-right: 1px solid #2b3036;
    display: flex; flex-direction: column; min-height: 0; padding: 10px 9px 9px;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  .hhead {
    font-size: 10.5px; letter-spacing: .09em; color: #6f7d8c; text-transform: uppercase;
    font-family: ui-monospace, Consolas, monospace; padding: 0 2px 6px; flex: none;
  }
  .hlist { display: flex; flex-direction: column; gap: 3px; overflow: auto; min-height: 0; }
  .hitem {
    display: flex; align-items: center; gap: 6px; padding: 5px 6px; border-radius: 4px;
    border: 1px solid transparent; cursor: pointer; font-size: 12px; color: #b8c0c8; user-select: none;
  }
  .hitem:hover { background: #1f2327; }
  .hitem.on { background: #223447; border-color: #3f7fb5; color: #eaf4ff; }
  .hitem .hdot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: #4a5560; }
  .hitem.on .hdot { background: #62b0ea; }
  .hitem .hname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hitem input[type=checkbox] { accent-color: #3f7fb5; width: 13px; height: 13px; cursor: pointer; }
  .hbtns { display: flex; gap: 4px; padding: 7px 0 2px; flex: none; }
  .hbtn {
    flex: 1; background: #22262a; border: 1px solid #3a4046; color: #a9b3bd; border-radius: 3px;
    font-size: 11px; padding: 5px 0; cursor: pointer; font-family: inherit; transition: all .12s;
  }
  .hbtn:hover { background: #2d3339; color: #e2ecf5; }

{

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =====================================================================
   0. 工具
   ===================================================================== */
/* ---------- 可复现随机（mulberry32） ---------- */
let rng = mulberry32(1);
function mulberry32(a) {
  a = a >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rnd() { return rng(); }
function reseed(s) {
  let v = Math.floor(Math.abs(Number(s) || 0)) % 4294967296;
  if (v === 0) v = 1;
  rng = mulberry32(v);
}
const rand = (a, b) => a + rnd() * (b - a);
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);

function evalCurve(pts, t) {
  if (!pts || !pts.length) return 1;
  const s = pts.slice().sort(function (a, b) { return a[0] - b[0]; });
  if (t <= s[0][0]) return s[0][1];
  const last = s[s.length - 1];
  if (t >= last[0]) return last[1];
  for (let i = 0; i < s.length - 1; i++) {
    const t0 = s[i][0], v0 = s[i][1], t1 = s[i + 1][0], v1 = s[i + 1][1];
    if (t >= t0 && t <= t1) {
      if (t1 === t0) return v1;
      const k = (t - t0) / (t1 - t0);
      return v0 + (v1 - v0) * (k * k * (3 - 2 * k));
    }
  }
  return last[1];
}

/* 渲染端尺寸钳制：等价 Unity Renderer 模块的 Min/Max Particle Size */
function clampSize(v) {
  const lo = P.minParticleSize > 0 ? P.minParticleSize : 0;
  const hi = P.maxParticleSize > 0 ? P.maxParticleSize : Infinity;
  if (lo <= 0 && hi === Infinity) return v;
  return clamp(v, lo, hi);
}

/* 深拷贝：预设套用时不污染预设本体 */
function deepClone(o) {
  if (o === null || typeof o !== 'object') return o;
  if (Array.isArray(o)) return o.map(deepClone);
  const r = {};
  for (const k in o) if (Object.prototype.hasOwnProperty.call(o, k)) r[k] = deepClone(o[k]);
  return r;
}

function hexToRgb(h) {
  const s = (h || '#ffffff').replace('#', '');
  return {
    r: parseInt(s.substring(0, 2), 16) / 255,
    g: parseInt(s.substring(2, 4), 16) / 255,
    b: parseInt(s.substring(4, 6), 16) / 255
  };
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window.__toastT);
  window.__toastT = setTimeout(function () { el.classList.remove('show'); }, 1900);
}

/* =====================================================================
   1. 参数模型
   ===================================================================== */
const DEFAULT = {
  /* --- Transform（整个粒子对象的变换，等价 Unity GameObject 的 Transform）--- */
  posX: 0, posY: 0, posZ: 0,
  rotX: 0, rotY: 0, rotZ: 0,
  scaleX: 1, scaleY: 1, scaleZ: 1,

  /* --- Main --- */
  duration: 5, looping: true, startDelay: 0,
  startLifetime: 2, startLifetimeMax: 2,
  startSpeed: 1, startSpeedMax: 1,
  startSize: 0.4, startSizeMax: 0.4,
  startRotMin: 0, startRotMax: 0,
  startColorA: '#ffffff', startColorB: '#ffffff',
  gravityModifier: 0, simulationSpace: 'world', simulationSpeed: 1,
  maxParticles: 500, randomSeed: 20260101,

/* --- Emission --- */
  rateOverTime: 20, burstTime: 0, burstCount: 0, burstCycles: 1, bursts: [],

  /* --- Shape --- */
  shapeType: 'circle',
  shapeRadius: 2, radiusThickness: 1,
  shapeAngle: 25, shapeLength: 3,
  shapeScaleX: 4, shapeScaleY: 2, shapeScaleZ: 2,
  shapeRotX: 0, shapeRotY: 0, shapeRotZ: 0,
  shapePosX: 0, shapePosY: 0, shapePosZ: 0,
  shapeRandomDir: 0, shapeArc: 360,
  wireOn: true,

  /* --- Velocity over Lifetime --- */
  velOn: false, velSpace: 'local',
  velX: 0, velY: 0, velZ: 0,
  orbitalZ: 0, velRadial: 0, velSpeedMod: 1,
  velSpeedCurve: [[0, 1], [1, 1]],

  /* --- Limit Velocity --- */
  limitOn: false, limitSpeed: 3, limitDampen: 0.1,

  /* --- Force over Lifetime --- */
  forceOn: false, forceSpace: 'world',
  forceX: 0, forceY: 0, forceZ: 0,

  /* --- Color over Lifetime --- */
  colOn: true,
  grad: [[0, '#ffffff', 1], [1, '#ffffff', 0]],

  /* --- Size over Lifetime --- */
  sizeOn: true,
  sizeCurve: [[0, 1], [0.5, 1], [1, 1]],
  sizePreset: 'const',

  /* --- Rotation over Lifetime --- */
  rotOn: false, rotSpeedMin: 0, rotSpeedMax: 0,

  /* --- Noise --- */
  noiseOn: false, noiseStrength: 1, noiseFrequency: 0.4,
  noiseScroll: 0.2, noiseDamping: true,

  /* --- Renderer --- */
  renderMode: 'billboard', texKey: 'softCircle', texRotation: 0,
  speedScale: 0.15, lengthScale: 2.5,
  minParticleSize: 0, maxParticleSize: 0.5,
  tint: '#ffffff', blending: 'additive',
  /* 自定义贴图采样模式：grayscale 用亮度当 alpha（黑底透明），alpha 沿用原图 alpha 通道 */
  texAlphaMode: 'grayscale',

  /* --- Trails --- */
  trailOn: false, trailLifetime: 0.4, trailRatio: 1, trailWidth: 1
};

let P = Object.assign({}, DEFAULT);
/* 贴图状态只保存在每个组内部（g.customTex），全局 customTexture 已移除，避免跨组污染 */
let view2D = true;

/* =====================================================================
   2. 贴图库
   ===================================================================== */
const TEX_SIZE = 128;

const TEX_GEN = {
  softCircle: function (c, s) {
    const g = c.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.45, 'rgba(255,255,255,0.55)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g; c.fillRect(0, 0, s, s);
  },
  hardDot: function (c, s) {
    c.fillStyle = '#fff';
    c.beginPath(); c.arc(s / 2, s / 2, s * 0.42, 0, Math.PI * 2); c.fill();
  },
  glow: function (c, s) {
    const g = c.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.12, 'rgba(255,255,255,0.9)');
    g.addColorStop(0.35, 'rgba(255,255,255,0.25)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g; c.fillRect(0, 0, s, s);
  },
  ring: function (c, s) {
    c.strokeStyle = '#fff'; c.lineWidth = s * 0.055;
    c.beginPath(); c.arc(s / 2, s / 2, s * 0.38, 0, Math.PI * 2); c.stroke();
    c.globalAlpha = 0.35; c.lineWidth = s * 0.02;
    c.beginPath(); c.arc(s / 2, s / 2, s * 0.27, 0, Math.PI * 2); c.stroke();
  },
  ringThin: function (c, s) {
    c.strokeStyle = '#fff'; c.lineWidth = s * 0.018;
    c.beginPath(); c.arc(s / 2, s / 2, s * 0.45, 0, Math.PI * 2); c.stroke();
  },
  star: function (c, s) {
    const cx = s / 2, cy = s / 2, R = s * 0.46, r = s * 0.13, n = 5;
    c.fillStyle = '#fff'; c.beginPath();
    for (let i = 0; i < n * 2; i++) {
      const ang = (Math.PI / n) * i - Math.PI / 2;
      const rad = i % 2 ? r : R;
      const x = cx + Math.cos(ang) * rad, y = cy + Math.sin(ang) * rad;
      if (i) c.lineTo(x, y); else c.moveTo(x, y);
    }
    c.closePath(); c.fill();
  },
  star4: function (c, s) {
    const cx = s / 2, cy = s / 2;
    c.fillStyle = '#fff';
    c.beginPath();
    c.moveTo(cx, 0); c.lineTo(cx + s * 0.09, cy - s * 0.09);
    c.lineTo(s, cy); c.lineTo(cx + s * 0.09, cy + s * 0.09);
    c.lineTo(cx, s); c.lineTo(cx - s * 0.09, cy + s * 0.09);
    c.lineTo(0, cy); c.lineTo(cx - s * 0.09, cy - s * 0.09);
    c.closePath(); c.fill();
  },
  streak: function (c, s) {
    const g = c.createLinearGradient(0, 0, s, 0);
    g.addColorStop(0, 'rgba(255,255,255,0)');
    g.addColorStop(0.4, 'rgba(255,255,255,1)');
    g.addColorStop(0.6, 'rgba(255,255,255,1)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g;
    c.beginPath(); c.ellipse(s / 2, s / 2, s / 2, s * 0.12, 0, 0, Math.PI * 2); c.fill();
  },
  sweep: function (c, s) {
    const g = c.createLinearGradient(0, 0, 0, s);
    g.addColorStop(0, 'rgba(255,255,255,0)');
    g.addColorStop(0.5, 'rgba(255,255,255,1)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g;
    c.fillRect(s * 0.06, 0, s * 0.88, s);
  },
  spark: function (c, s) {
    const cx = s / 2, cy = s / 2;
    const g = c.createRadialGradient(cx, cy, 0, cx, cy, s * 0.16);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g; c.beginPath(); c.arc(cx, cy, s * 0.16, 0, Math.PI * 2); c.fill();
    c.strokeStyle = 'rgba(255,255,255,0.85)'; c.lineWidth = s * 0.022; c.lineCap = 'round';
    for (let i = 0; i < 4; i++) {
      const a = (Math.PI / 2) * i + Math.PI / 4;
      const len = i % 2 ? s * 0.4 : s * 0.5;
      c.beginPath(); c.moveTo(cx, cy);
      c.lineTo(cx + Math.cos(a) * len, cy + Math.sin(a) * len); c.stroke();
    }
  },
  square: function (c, s) {
    c.fillStyle = '#fff';
    c.fillRect(s * 0.15, s * 0.15, s * 0.7, s * 0.7);
  },
  rhombus: function (c, s) {
    c.fillStyle = '#fff'; c.beginPath();
    c.moveTo(s / 2, s * 0.06); c.lineTo(s * 0.94, s / 2);
    c.lineTo(s / 2, s * 0.94); c.lineTo(s * 0.06, s / 2);
    c.closePath(); c.fill();
  },
  triangle: function (c, s) {
    c.fillStyle = '#fff'; c.beginPath();
    c.moveTo(s / 2, s * 0.1);
    c.lineTo(s * 0.9, s * 0.85);
    c.lineTo(s * 0.1, s * 0.85);
    c.closePath(); c.fill();
  },
  heart: function (c, s) {
    c.fillStyle = '#fff'; c.beginPath();
    const cx = s / 2, cy = s * 0.56, k = s * 0.4;
    c.moveTo(cx, cy + k * 0.75);
    c.bezierCurveTo(cx - k * 1.5, cy - k * 0.35, cx - k * 0.45, cy - k * 1.15, cx, cy - k * 0.35);
    c.bezierCurveTo(cx + k * 0.45, cy - k * 1.15, cx + k * 1.5, cy - k * 0.35, cx, cy + k * 0.75);
    c.fill();
  },
  cross: function (c, s) {
    c.fillStyle = '#fff';
    c.fillRect(s * 0.42, s * 0.1, s * 0.16, s * 0.8);
    c.fillRect(s * 0.1, s * 0.42, s * 0.8, s * 0.16);
  },
  gradientBar: function (c, s) {
    const g = c.createLinearGradient(0, 0, s, 0);
    g.addColorStop(0, 'rgba(255,255,255,0)');
    g.addColorStop(0.5, 'rgba(255,255,255,1)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g; c.fillRect(0, s * 0.32, s, s * 0.36);
  },
  /* 扫光条：竖直满高，水平方向软边（左右透明→中间亮），配合单面片做扫光 */
  sweepBar: function (c, s) {
    const g = c.createLinearGradient(0, 0, s, 0);
    g.addColorStop(0, 'rgba(255,255,255,0)');
    g.addColorStop(0.30, 'rgba(255,255,255,0.55)');
    g.addColorStop(0.5, 'rgba(255,255,255,1)');
    g.addColorStop(0.70, 'rgba(255,255,255,0.55)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g;
    c.fillRect(0, 0, s, s);
  },
  smoke: function (c, s) {
    for (let i = 0; i < 7; i++) {
      const x = s * 0.5 + rand(-s * 0.16, s * 0.16);
      const y = s * 0.5 + rand(-s * 0.16, s * 0.16);
      const r = rand(s * 0.14, s * 0.28);
      const g = c.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, 'rgba(255,255,255,0.16)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
    }
  }
};

const TEX_LABEL = {
  softCircle: 'Soft Circle', hardDot: 'Hard Dot', glow: 'Glow', ring: 'Ring',
  ringThin: 'Thin Ring', star: 'Star', star4: 'Star 4-Point', streak: 'Horizontal Streak',
  sweep: 'Vertical Sweep', spark: 'Sparkle', square: 'Square', rhombus: 'Rhombus',
  triangle: 'Triangle', heart: 'Heart', cross: 'Cross', gradientBar: 'Gradient Bar', smoke: 'Smoke',
  sweepBar: 'Sweep Bar (vertical)'
};

const texCache = {};

function buildTextureCanvas(key) {
  if (texCache[key]) return texCache[key];
  const cv = document.createElement('canvas');
  cv.width = cv.height = TEX_SIZE;
  const c = cv.getContext('2d');
  c.clearRect(0, 0, TEX_SIZE, TEX_SIZE);
  (TEX_GEN[key] || TEX_GEN.softCircle)(c, TEX_SIZE);
  texCache[key] = cv;
  return cv;
}

/* =====================================================================
   3. Three 场景
   ===================================================================== */
const viewport = document.getElementById('viewport');
const scene = new THREE.Scene();
scene.background = null;

const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 800);
camera.position.set(0, 0, 12);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);
viewport.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.12;
controls.screenSpacePanning = true;

/* 粒子对象的根节点：等价 Unity 里挂着 ParticleSystem 的那个 GameObject */
const particleRoot = new THREE.Group();
particleRoot.name = 'UI_Particle';
scene.add(particleRoot);

/* 纯净模式开关状态：必须在场景初始化处声明，buildUI 内会调用 set2D 读取它 */
let pureMode = false;

const gridGroup = new THREE.Group();
scene.add(gridGroup);

function buildGrid() {
  while (gridGroup.children.length) {
    const ch = gridGroup.children.pop();
    ch.geometry.dispose();
    ch.material.dispose();
  }
  const grid = new THREE.GridHelper(40, 40, 0x3a3a3a, 0x262626);
  grid.rotation.x = Math.PI / 2;
  gridGroup.add(grid);

  const mkAxis = function (from, to, color) {
    const g = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(from[0], from[1], from[2]),
      new THREE.Vector3(to[0], to[1], to[2])
    ]);
    const m = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: 0.85 });
    return new THREE.Line(g, m);
  };
  gridGroup.add(mkAxis([-20, 0, 0], [20, 0, 0], 0x8a3a3a));
  gridGroup.add(mkAxis([0, -20, 0], [0, 20, 0], 0x3a8a3a));
  gridGroup.add(mkAxis([0, 0, -20], [0, 0, 20], 0x3a4a8a));
}
buildGrid();

const outline = new THREE.Mesh(
  new THREE.PlaneGeometry(1, 1),
  new THREE.MeshBasicMaterial({ color: 0xffb340, wireframe: true, transparent: true, opacity: 0.5 })
);
outline.visible = false;
particleRoot.add(outline);

/* =====================================================================
   4. 粒子着色器 / InstancedBufferGeometry
   ===================================================================== */
const MAX_P = 5000;

/* quad 基础顶点数据各粒子组共用一份；实例属性（iPos/iSize/...）每组独立一份 */
const basePosAttr = new THREE.BufferAttribute(new Float32Array([-0.5, -0.5, 0, 0.5, -0.5, 0, 0.5, 0.5, 0, -0.5, 0.5, 0]), 3);
const baseUvAttr = new THREE.BufferAttribute(new Float32Array([0, 0, 1, 0, 1, 1, 0, 1]), 2);
const baseIdxArr = [0, 1, 2, 0, 2, 3];

/* 当前绑定组（bindGroup 切换）：模拟与渲染函数统一读写下面这些引用 */
let quadGeo = null;
let iPos = null, iSize = null, iColor = null, iRot = null, iVel = null;


const VERT = [
  'precision highp float;',
  'attribute vec3 iPos;',
  'attribute vec2 iSize;',
  'attribute vec4 iColor;',
  'attribute float iRot;',
  'attribute vec3 iVel;',
  'uniform float uMode;',
  'uniform float uSpeedScale;',
  'uniform float uLengthScale;',
  'uniform float uTexRotation;',
  'uniform float uOpacity;',
  'varying vec2 vUv;',
  'varying vec2 vQuad;',
  'varying vec4 vColor;',
  'void main() {',
  '  vec3 wp = iPos;',
  '  float s = iSize.x;',
  '  float stretched = iSize.y;',
  '  float rot = iRot + uTexRotation;',
  '  float cr = cos(rot);',
  '  float sr = sin(rot);',
  '  vec2 q = position.xy;',
  '  vec3 vel = iVel;',
  '  float spd = length(vel);',
  '  if (uMode > 1.5) {',
  '    float len = uLengthScale * s;',
  '    if (uMode > 2.5) {',
  '      wp.x += q.x * s;',
  '      wp.y += q.y * len;',
  '    } else {',
  '      wp.x += q.x * len;',
  '      wp.y += q.y * s;',
  '    }',
  '    vUv = vec2(q.x + 0.5, q.y + 0.5);',
  '  } else if (uMode > 0.5) {',
  '    float len = uLengthScale * s + spd * uSpeedScale * s;',
  '    vec2 dir = spd > 0.0001 ? normalize(vel.xy) : vec2(1.0, 0.0);',
  '    vec2 nrm = vec2(-dir.y, dir.x);',
  '    float along = (q.x + 0.5) * len;',
  '    float across = q.y * s;',
  '    vec2 off = dir * (along - len * 0.5) + nrm * across;',
  '    wp.x += off.x;',
  '    wp.y += off.y;',
  '    vUv = vec2(along / max(len, 0.0001), q.y + 0.5);',
  '  } else {',
  '    vec2 rx = vec2(cr * q.x - sr * q.y, sr * q.x + cr * q.y);',
  '    wp.x += rx.x * s;',
  '    wp.y += rx.y * s;',
  '    vUv = vec2(q.x + 0.5, q.y + 0.5);',
  '  }',
  '  vQuad = vec2(q.x + 0.5, q.y + 0.5);',
  '  vColor = vec4(iColor.rgb * stretched, iColor.a * uOpacity);',
  '  gl_Position = projectionMatrix * modelViewMatrix * vec4(wp, 1.0);',
  '}'
].join('\n');

const FRAG = [
  'precision highp float;',
  'uniform sampler2D uTex;',
  'uniform float uUseTex;',
  'varying vec2 vUv;',
  'varying vec2 vQuad;',
  'varying vec4 vColor;',
  'void main() {',
  '  vec4 t = uUseTex > 0.5 ? texture2D(uTex, vUv) : vec4(1.0);',
  '  gl_FragColor = vec4(vColor.rgb, vColor.a * t.a);',
  '  if (gl_FragColor.a < 0.004) discard;',
  '}'
].join('\n');

function makeUniforms() {
  return {
    uTex: { value: null },
    uUseTex: { value: 1 },
    uMode: { value: 0 },
    uSpeedScale: { value: 0.15 },
    uLengthScale: { value: 2.5 },
    uTexRotation: { value: 0 },
    uOpacity: { value: 1 }
  };
}

/* 每个粒子组各建一套几何 + 材质 + uniforms，互不干扰 */
function makeGroupAssets() {
  const geo = new THREE.InstancedBufferGeometry();
  geo.setAttribute('position', basePosAttr);
  geo.setAttribute('uv', baseUvAttr);
  geo.setIndex(baseIdxArr);

  const aPos = new THREE.InstancedBufferAttribute(new Float32Array(MAX_P * 3), 3);
  const aSize = new THREE.InstancedBufferAttribute(new Float32Array(MAX_P * 2), 2);
  const aColor = new THREE.InstancedBufferAttribute(new Float32Array(MAX_P * 4), 4);
  const aRot = new THREE.InstancedBufferAttribute(new Float32Array(MAX_P), 1);
  const aVel = new THREE.InstancedBufferAttribute(new Float32Array(MAX_P * 3), 3);
  [aPos, aSize, aColor, aRot, aVel].forEach(function (a) { a.setUsage(THREE.DynamicDrawUsage); });
  geo.setAttribute('iPos', aPos);
  geo.setAttribute('iSize', aSize);
  geo.setAttribute('iColor', aColor);
  geo.setAttribute('iRot', aRot);
  geo.setAttribute('iVel', aVel);
  geo.instanceCount = 0;

  const uni = makeUniforms();
  const m = new THREE.ShaderMaterial({
    uniforms: uni,
    vertexShader: VERT,
    fragmentShader: FRAG,
    transparent: true,
    depthWrite: false,
    depthTest: false,
    blending: THREE.AdditiveBlending,
    side: THREE.DoubleSide
  });
  const mesh = new THREE.Mesh(geo, m);
  mesh.frustumCulled = false;
  return { geo: geo, iPos: aPos, iSize: aSize, iColor: aColor, iRot: aRot, iVel: aVel, uniforms: uni, mat: m, mesh: mesh };
}

let uniforms = null;
let mat = null;
let particleMesh = null;

const texLoader = new THREE.TextureLoader();

/* 贴图按组缓存：每个组按自己的 texKey 生成自己的纹理，互不覆盖 */
function texForGroup(g) {
  const key = (g.P && g.P.texKey) || 'softCircle';
  if (!g.tex || g.texKey !== key) {
    if (g.tex && g.tex.dispose) g.tex.dispose();
    const cv = buildTextureCanvas(key);
    const tex = new THREE.CanvasTexture(cv);
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.generateMipmaps = false;
    g.tex = tex;
    g.texKey = key;
  }
  return g.tex;
}

function resetGroupTexture(g) {
  if (!g) return;
  if (g.customTex && g.customTex.dispose) g.customTex.dispose();
  g.customTex = null;
  g.customSrc = null;   /* 丢弃原图，避免下次切模式时又把自定义贴图复原 */
}

function applyTextureTo(g) {
  if (!g) return;
  g.assets.uniforms.uTex.value = g.customTex || texForGroup(g);
  g.assets.uniforms.uUseTex.value = 1;
}

/* 把上传图片按采样模式转成"遮罩"贴图：
   grayscale —— alpha = 原 alpha × 亮度/255，黑底完全透明，常见黑白图可直接当形状用；
   alpha     —— 沿用原图 alpha 通道。
   RGB 统一做反预乘归一化 rgb × 255 / max(lum,1)（上限 255），避免粒子发灰发暗。 */
function buildCustomTexture(img, mode) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = TEX_SIZE;
  const c = cv.getContext('2d');
  c.clearRect(0, 0, TEX_SIZE, TEX_SIZE);
  /* 先等比居中裁成正方形，非正方形图片不会被拉伸 */
  const iw = img.width || 1, ih = img.height || 1;
  const side = Math.max(1, Math.min(iw, ih));
  const sx = Math.max(0, (iw - side) / 2);
  const sy = Math.max(0, (ih - side) / 2);
  c.drawImage(img, sx, sy, side, side, 0, 0, TEX_SIZE, TEX_SIZE);
  if (mode !== 'alpha') {
    let data = null;
    try { data = c.getImageData(0, 0, TEX_SIZE, TEX_SIZE); } catch (e) { data = null; }
    if (data) {
      const d = data.data;
      for (let i = 0; i < d.length; i += 4) {
        const r = d[i], g2 = d[i + 1], b = d[i + 2], a = d[i + 3];
        const lum = 0.299 * r + 0.587 * g2 + 0.114 * b;
        const nl = Math.max(lum, 1);
        d[i] = Math.min(255, Math.round(r * 255 / nl));
        d[i + 1] = Math.min(255, Math.round(g2 * 255 / nl));
        d[i + 2] = Math.min(255, Math.round(b * 255 / nl));
        d[i + 3] = Math.round(a * lum / 255);
      }
      c.putImageData(data, 0, 0);
    }
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.generateMipmaps = false;
  tex.needsUpdate = true;
  return tex;
}

/* 用组内保存的原图按当前 texAlphaMode 重算自定义贴图 */
function rebuildCustomTexture(g) {
  if (!g || !g.customSrc) return false;
  const mode = (g.P && g.P.texAlphaMode) || 'grayscale';
  const tex = buildCustomTexture(g.customSrc, mode);
  if (g.customTex && g.customTex.dispose) g.customTex.dispose();
  g.customTex = tex;
  applyTextureTo(g);
  return true;
}

function rebuildAllCustomTextures() {
  let n = 0;
  for (let i = 0; i < GROUPS.length; i++) {
    if (rebuildCustomTexture(GROUPS[i])) n++;
  }
  if (uiRefs.__texBody) buildTexGrid(uiRefs.__texBody);
  return n;
}

function applyMaterialParamsTo(g) {
  if (!g) return;
  const PP = g.P;
  const u = g.assets.uniforms;
  const modeMap = { billboard: 0, stretched: 1, horizontal: 2, vertical: 3 };
  u.uMode.value = modeMap[PP.renderMode] || 0;
  u.uSpeedScale.value = PP.speedScale;
  u.uLengthScale.value = PP.lengthScale;
  u.uTexRotation.value = PP.texRotation * Math.PI / 180;
  u.uOpacity.value = 1;
  g.assets.mat.blending = PP.blending === 'additive' ? THREE.AdditiveBlending : THREE.NormalBlending;
  g.assets.mat.needsUpdate = true;
}

/* 所有组都刷一遍贴图/材质/线框，多组同屏时每组才显示成自己的样子 */
function refreshAllGroupVisuals() {
  for (let i = 0; i < GROUPS.length; i++) {
    applyTextureTo(GROUPS[i]);
    applyMaterialParamsTo(GROUPS[i]);
    updateWire(GROUPS[i]);
  }
}

function applyTexture() {
  /* 只使用当前组自己的贴图状态（g.customTex ?? 内置纹理），不再读取全局 customTexture */
  applyTextureTo(GROUPS[gActive]);
}

function applyMaterialParams() {
  applyMaterialParamsTo(GROUPS[gActive]);
}

/* =====================================================================
   4.5 粒子组（Particle Groups）
   ===================================================================== */
const GROUPS = [];
let gActive = 0;

function normParams(src) {
  const o = deepClone(Object.assign({}, DEFAULT, src || {}));
  if (!o.sizeCurve || !o.sizeCurve.length) o.sizeCurve = SIZE_PRESETS.const;
  if (!o.velSpeedCurve || !o.velSpeedCurve.length) o.velSpeedCurve = [[0, 1], [1, 1]];
  if (!Array.isArray(o.bursts)) o.bursts = [];
  return o;
}

/* ---------- Shape 范围线框（浅色，仅辅助定位） ---------- */
function makeWire() {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(0), 3));
  const m = new THREE.LineBasicMaterial({
    color: 0x8fc6ff, transparent: true, opacity: 0.32, depthTest: false, depthWrite: false
  });
  const line = new THREE.LineSegments(geo, m);
  line.frustumCulled = false;
  line.visible = false;
  return line;
}

function updateWire(g) {
  if (!g || !g.wire) return;
  const PP = g.P;
  const pts = [];
  const seg = function (ax, ay, az, bx, by, bz) { pts.push(ax, ay, az, bx, by, bz); };
  const ring = function (rad, n) {
    for (let i = 0; i < n; i++) {
      const a1 = i / n * Math.PI * 2, a2 = (i + 1) / n * Math.PI * 2;
      seg(Math.cos(a1) * rad, Math.sin(a1) * rad, 0, Math.cos(a2) * rad, Math.sin(a2) * rad, 0);
    }
  };
  const ringPlane = function (rad, n, plane) {
    for (let i = 0; i < n; i++) {
      const a1 = i / n * Math.PI * 2, a2 = (i + 1) / n * Math.PI * 2;
      const p1 = plane === 'yz' ? [0, Math.cos(a1) * rad, Math.sin(a1) * rad] : [Math.cos(a1) * rad, 0, Math.sin(a1) * rad];
      const p2 = plane === 'yz' ? [0, Math.cos(a2) * rad, Math.sin(a2) * rad] : [Math.cos(a2) * rad, 0, Math.sin(a2) * rad];
      seg(p1[0], p1[1], p1[2], p2[0], p2[1], p2[2]);
    }
  };
  const rect = function (w, h) {
    const x = w / 2, y = h / 2;
    seg(-x, -y, 0, x, -y, 0); seg(x, -y, 0, x, y, 0); seg(x, y, 0, -x, y, 0); seg(-x, y, 0, -x, -y, 0);
  };
  const r = Math.max(0.0005, Math.abs(PP.shapeRadius) || 0.0005);
  const t = PP.shapeType;
  if (t === 'rectangle') {
    rect(PP.shapeScaleX, PP.shapeScaleY);
  } else if (t === 'box') {
    const x = PP.shapeScaleX / 2, y = PP.shapeScaleY / 2, z = Math.max(0.0005, PP.shapeScaleZ / 2);
    seg(-x, -y, -z, x, -y, -z); seg(x, -y, -z, x, y, -z); seg(x, y, -z, -x, y, -z); seg(-x, y, -z, -x, -y, -z);
    seg(-x, -y, z, x, -y, z); seg(x, -y, z, x, y, z); seg(x, y, z, -x, y, z); seg(-x, y, z, -x, -y, z);
    seg(-x, -y, -z, -x, -y, z); seg(x, -y, -z, x, -y, z); seg(x, y, -z, x, y, z); seg(-x, y, -z, -x, y, z);
  } else if (t === 'edge') {
    const L = Math.max(0.0005, PP.shapeLength);
    seg(-L / 2, 0, 0, L / 2, 0, 0);
  } else if (t === 'cone') {
    ring(r, 48);
    const hh = r / Math.max(0.12, Math.tan(clamp(PP.shapeAngle, 1, 89) * Math.PI / 180));
    for (let i = 0; i < 4; i++) {
      const a = i / 4 * Math.PI * 2;
      seg(0, hh, 0, Math.cos(a) * r, 0, Math.sin(a) * r);
    }
  } else if (t === 'sphere' || t === 'hemisphere') {
    ring(r, 48);
    ringPlane(r, 48, 'xz');
    if (t === 'sphere') ringPlane(r, 48, 'yz');
  } else if (t === 'donut') {
    /* 甜甜圈：外圈 r + 内圈 r*0.72（与 sampleShape 的 tube = r*0.28 一致） */
    ring(r, 64);
    ring(r * 0.72, 64);
  } else {
    /* 圆盘：仅当厚度 < 1（形成环）时才画内圈，避免切形状后残留甜甜圈内圈 */
    ring(r, 64);
    const inner = r * (1 - clamp(PP.radiusThickness, 0, 1));
    if (inner > 0.0008) ring(inner, 64);
  }

  const geo = g.wire.geometry;
  const need = pts.length;
  let attr = geo.getAttribute('position');
  if (!attr || attr.array.length < need) {
    /* 只在容量不足时扩容；同一几何反复复用时靠 drawRange 精确控制长度 */
    const cap = Math.max(need, Math.ceil(need * 1.5), 900);
    attr = new THREE.BufferAttribute(new Float32Array(cap), 3);
    attr.setUsage(THREE.DynamicDrawUsage);
    geo.setAttribute('position', attr);
  }
  const arr = attr.array;
  arr.fill(0);              /* 关键：先清零，绝不残留上一个形状（例如甜甜圈的内外圈）的顶点 */
  arr.set(pts, 0);
  attr.needsUpdate = true;
  geo.setDrawRange(0, need / 3);
  geo.computeBoundingSphere();
  g.wire.position.set(PP.shapePosX, PP.shapePosY, PP.shapePosZ);
  g.wire.rotation.set(PP.shapeRotX * Math.PI / 180, PP.shapeRotY * Math.PI / 180, PP.shapeRotZ * Math.PI / 180);
  g.wire.visible = !!PP.wireOn;
}

/* ---------- 组创建 / 绑定 ---------- */
function makeGroup(name, params) {
  const g = {
    name: name || 'Particle',
    P: normParams(params),
    particles: [], pool: [],
    emitAcc: 0, simTime: 0, sysElapsed: -1, burstPhase: -1, seedCounter: 1,
    rng: mulberry32(1),
    play: true,
    tex: null, texKey: '', customTex: null, customSrc: null,
    assets: makeGroupAssets(),
    holder: new THREE.Group(),
    wire: null
  };
  g.holder.name = g.name;
  g.holder.add(g.assets.mesh);
  g.wire = makeWire();
  g.holder.add(g.wire);
  particleRoot.add(g.holder);
  applyTextureTo(g);
  applyMaterialParamsTo(g);
  updateWire(g);
  return g;
}

function bindGroup(i) {
  if (!GROUPS.length) return;
  commitGroup();
  gActive = Math.max(0, Math.min(i, GROUPS.length - 1));
  const g = GROUPS[gActive];
  P = g.P;
  particles = g.particles;
  pool = g.pool;
  emitAcc = g.emitAcc;
  simTime = g.simTime;
  sysElapsed = g.sysElapsed;
  burstPhase = g.burstPhase;
  seedCounter = g.seedCounter;
  rng = g.rng;
  const a = g.assets;
  quadGeo = a.geo;
  iPos = a.iPos; iSize = a.iSize; iColor = a.iColor; iRot = a.iRot; iVel = a.iVel;
  uniforms = a.uniforms;
  mat = a.mat;
  particleMesh = a.mesh;
}

function commitGroup() {
  const g = GROUPS[gActive];
  if (!g) return;
  g.particles = particles;
  g.pool = pool;
  g.emitAcc = emitAcc;
  g.simTime = simTime;
  g.sysElapsed = sysElapsed;
  g.burstPhase = burstPhase;
  g.seedCounter = seedCounter;
  g.rng = rng;
}

/* ---------- 组管理 / 左侧面板（Particle Groups + Playback） ---------- */
function syncGroupUI() {
  const gl = document.getElementById('glist');
  const pl = document.getElementById('plist');
  if (gl) {
    gl.innerHTML = '';
    for (let i = 0; i < GROUPS.length; i++) {
      const it = document.createElement('div');
      it.className = 'hitem' + (i === gActive ? ' on' : '');
      const dot = document.createElement('span');
      dot.className = 'hdot';
      it.appendChild(dot);
      const nm = document.createElement('span');
      nm.className = 'hname';
      nm.textContent = GROUPS[i].name;
      it.appendChild(nm);
      it.title = 'Click to select and edit this group';
      (function (idx) { it.addEventListener('click', function () { selectGroup(idx); }); })(i);
      gl.appendChild(it);
    }
  }
  if (pl) {
    pl.innerHTML = '';
    for (let i = 0; i < GROUPS.length; i++) {
      const it = document.createElement('div');
      it.className = 'hitem';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = !!GROUPS[i].play;
      cb.addEventListener('click', function (e) { e.stopPropagation(); });
      (function (idx, box) {
        box.addEventListener('change', function () { GROUPS[idx].play = box.checked; });
      })(i, cb);
      it.appendChild(cb);
      const nm = document.createElement('span');
      nm.className = 'hname';
      nm.textContent = GROUPS[i].name;
      it.appendChild(nm);
      it.title = 'When checked, this group takes part in playback';
      (function (idx) { it.addEventListener('click', function () { selectGroup(idx); }); })(i);
      pl.appendChild(it);
    }
  }
}

function selectGroup(i) {
  if (!GROUPS.length) return;
  i = Math.max(0, Math.min(i, GROUPS.length - 1));
  bindGroup(i);
  applyTexture();
  applyMaterialParams();
  applyTransform();
  buildUI();
  syncUI();
  refreshInfoPanel();
  syncGroupUI();
  if (GROUPS.length) writeBuffers();
}

function nextGroupName() {
  let n = GROUPS.length + 1;
  let nm = 'Particle ' + n;
  let guard = 0;
  while (guard++ < 300 && GROUPS.some(function (g) { return g.name === nm; })) {
    n++;
    nm = 'Particle ' + n;
  }
  return nm;
}

function addGroup(name, params) {
  const g = makeGroup(name || nextGroupName(), params || P);
  GROUPS.push(g);
  syncGroupUI();
  return g;
}

function dupGroup() {
  const src = GROUPS[gActive];
  const g = makeGroup((src ? src.name : 'Particle') + ' Copy', src ? src.P : P);
  GROUPS.push(g);
  selectGroup(GROUPS.length - 1);
  toast('Copied as ' + g.name);
}

function delGroup() {
  if (GROUPS.length <= 1) { toast('At least one particle group must remain'); return; }
  const idx = gActive;
  const g = GROUPS[idx];
  gActive = -1;               /* 阻止 commitGroup 把当前状态写回别的组 */
  GROUPS.splice(idx, 1);
  particleRoot.remove(g.holder);
  try {
    g.assets.geo.dispose();
    g.assets.mat.dispose();
    if (g.wire) { g.wire.geometry.dispose(); g.wire.material.dispose(); }
  } catch (e) {}
  bindGroup(Math.min(idx, GROUPS.length - 1));
  applyTexture();
  applyMaterialParams();
  applyTransform();
  buildUI();
  syncUI();
  refreshInfoPanel();
  syncGroupUI();
  toast('Deleted ' + g.name);
}

/* Play All / Stop All：真正让所有组一起跑起来（同时解除暂停） */
function playAllGroups(on) {
  for (let i = 0; i < GROUPS.length; i++) {
    const g = GROUPS[i];
    g.play = !!on;
    if (on) {
      /* 重新起播：把该组计时归零，否则循环型/已放完的组会“点了没反应” */
      g.sysElapsed = -1;
      g.burstPhase = -1;
    }
  }
  if (on) {
    refreshAllGroupVisuals();
    paused = false;
    const pb = document.getElementById('btnPause');
    if (pb) pb.textContent = 'Pause';
    stepAcc = 0;
    lastT = performance.now();
  }
  syncGroupUI();
  toast(on ? ('Play All: ' + GROUPS.length + ' groups playing in sync') : 'Stopped all groups');
}

function bindGroupPanelButtons() {
  const map = [
    ['btnAddGroup', function () { const g = addGroup(); selectGroup(GROUPS.length - 1); toast('Added ' + g.name); }],
    ['btnDupGroup', function () { dupGroup(); }],
    ['btnDelGroup', function () { delGroup(); }],
    ['btnPlayAll', function () { playAllGroups(true); }],
    ['btnPlayNone', function () { playAllGroups(false); }]
  ];
  for (let i = 0; i < map.length; i++) {
    const el = document.getElementById(map[i][0]);
    if (el && !el.dataset.bound) {
      el.dataset.bound = '1';
      el.addEventListener('click', map[i][1]);
    }
  }
  syncGroupUI();
}


/* =====================================================================
   5. 粒子模拟
   ===================================================================== */
const GRAVITY = -9.81;
let particles = [];
let pool = [];
let emitAcc = 0;
let simTime = 0;
let sysElapsed = 0;
let burstPhase = -1;
let paused = false;
let seedCounter = 1;

function drawColor(r) {
  const grad = P.grad.slice().sort(function (a, b) { return a[0] - b[0]; });
  if (!grad.length) return { r: 1, g: 1, b: 1, a: 1 };
  let c0 = grad[0], c1 = grad[grad.length - 1];
  for (let i = 0; i < grad.length - 1; i++) {
    if (r >= grad[i][0] && r <= grad[i + 1][0]) { c0 = grad[i]; c1 = grad[i + 1]; break; }
  }
  const span = (c1[0] - c0[0]) || 1;
  const k = clamp((r - c0[0]) / span, 0, 1);
  const a = hexToRgb(c0[1]), b = hexToRgb(c1[1]);
  return {
    r: a.r + (b.r - a.r) * k,
    g: a.g + (b.g - a.g) * k,
    b: a.b + (b.b - a.b) * k,
    a: c0[2] + (c1[2] - c0[2]) * k
  };
}

const SIZE_PRESETS = {
  const: [[0, 1], [1, 1]],
  fadeInOut: [[0, 0], [0.25, 1], [1, 0]],
  fadeIn: [[0, 0], [0.3, 1], [1, 1]],
  fadeOut: [[0, 1], [1, 0]],
  grow: [[0, 0.15], [1, 1]],
  shrink: [[0, 1], [1, 0.05]],
  pop: [[0, 1], [0.7, 1.05], [1, 0]]
};

const SHAPE_TYPES = ['sphere', 'hemisphere', 'cone', 'box', 'circle', 'donut', 'rectangle', 'edge'];

function randomShapeDir() {
  const u = rnd() * 2 - 1;
  const theta = rnd() * Math.PI * 2;
  const sq = Math.sqrt(1 - u * u);
  return new THREE.Vector3(sq * Math.cos(theta), sq * Math.sin(theta), u);
}

function sampleShape() {
  const out = new THREE.Vector3();
  const rt = clamp(P.radiusThickness, 0, 1);
  const dir = new THREE.Vector3();
  const t = P.shapeType;

  if (t === 'sphere' || t === 'hemisphere') {
    dir.copy(randomShapeDir());
    const k = 1 - rt * (1 - Math.cbrt(1 - rnd()));
    out.copy(dir).multiplyScalar(P.shapeRadius * k);
    if (t === 'hemisphere') out.y = Math.abs(out.y) * (dir.y < 0 ? 1 : 1);
    if (t === 'hemisphere') out.y = Math.abs(out.y);
    out.z = 0;
  } else if (t === 'cone' || t === 'circle') {
    const arc = (P.shapeArc / 360) * Math.PI * 2;
    const ang = rand(-arc / 2, arc / 2);
    const r = P.shapeRadius * (1 - rt * (1 - Math.sqrt(rnd())));
    out.set(Math.sin(ang) * r, Math.cos(ang) * r, 0);
  } else if (t === 'box' || t === 'rectangle') {
    const hx = (t === 'box' ? P.shapeRadius : P.shapeScaleX / 2);
    const hy = (t === 'box' ? P.shapeRadius : P.shapeScaleY / 2);
    const hz = (t === 'box' ? P.shapeRadius : 0);
    if (rt >= 0.999) {
      const face = Math.floor(rnd() * 6);
      if (face === 0) out.set(hx, rand(-hy, hy), rand(-hz, hz));
      else if (face === 1) out.set(-hx, rand(-hy, hy), rand(-hz, hz));
      else if (face === 2) out.set(rand(-hx, hx), hy, rand(-hz, hz));
      else if (face === 3) out.set(rand(-hx, hx), -hy, rand(-hz, hz));
      else if (face === 4) out.set(rand(-hx, hx), rand(-hy, hy), hz);
      else out.set(rand(-hx, hx), rand(-hy, hy), -hz);
    } else {
      out.set(rand(-hx, hx), rand(-hy, hy), rand(-hz, hz));
    }
  } else if (t === 'donut') {
    const arc = (P.shapeArc / 360) * Math.PI * 2;
    const ang = rand(-arc / 2, arc / 2);
    const tube = P.shapeRadius * 0.28;
    const rIn = P.shapeRadius - tube;
    const rr = rIn + tube * Math.sqrt(rnd());
    out.set(Math.sin(ang) * rr, Math.cos(ang) * rr, 0);
  } else if (t === 'edge') {
    const len = P.shapeLength;
    out.set(rand(-len / 2, len / 2), 0, 0);
  }

  out.x += P.shapePosX; out.y += P.shapePosY; out.z += P.shapePosZ;
  return out;
}

function sampleShapeDir() {
  const d = new THREE.Vector3();
  const t = P.shapeType;
  if (t === 'circle' || t === 'cone' || t === 'donut' || t === 'edge') {
    const arc = (P.shapeArc / 360) * Math.PI * 2;
    let ang = rand(-arc / 2, arc / 2);
    if (P.shapeRandomDir > 0.001 && rnd() < P.shapeRandomDir) {
      ang = rnd() * Math.PI * 2;
    }
    d.set(Math.sin(ang), Math.cos(ang), 0);
  } else if (t === 'rectangle') {
    if (P.shapeRandomDir > 0.001 && rnd() < P.shapeRandomDir) {
      const a = rnd() * Math.PI * 2;
      d.set(Math.sin(a), Math.cos(a), 0);
    } else {
      d.set(0, 1, 0);
    }
  } else if (t === 'hemisphere') {
    d.copy(randomShapeDir());
    d.y = Math.abs(d.y);
  } else {
    d.copy(randomShapeDir());
  }

  if (Math.abs(d.lengthSq()) < 1e-8) d.set(0, 1, 0);
  d.normalize();

  const rx = P.shapeRotX * Math.PI / 180;
  const ry = P.shapeRotY * Math.PI / 180;
  const rz = P.shapeRotZ * Math.PI / 180;
  const e = new THREE.Euler(rx, ry, rz, 'XYZ');
  d.applyEuler(e);
  return d;
}

function spawnParticle(t0) {
  if (particles.length >= P.maxParticles) return;
  const base = new THREE.Vector3(0, 0, 0);
  const p = {
    pos: base.clone(),
    vel: new THREE.Vector3(),
    age: 0,
    life: rand(Math.min(P.startLifetime, P.startLifetimeMax), Math.max(P.startLifetime, P.startLifetimeMax)),
    size0: rand(Math.min(P.startSize, P.startSizeMax), Math.max(P.startSize, P.startSizeMax)),
    size: 0,
    rot: rand(Math.min(P.startRotMin, P.startRotMax), Math.max(P.startRotMin, P.startRotMax)) * Math.PI / 180,
    rotSpeed: rand(Math.min(P.rotSpeedMin, P.rotSpeedMax), Math.max(P.rotSpeedMin, P.rotSpeedMax)) * Math.PI / 180,
    color: { r: 1, g: 1, b: 1, a: 1 },
    stretch: 1,
    seed: seedCounter++,
    seedA: rnd() * 1000,
    seedB: rnd() * 1000,
    seedC: rnd() * 1000,
    t0: t0
  };
  p.pos.add(sampleShape());
  const dir = sampleShapeDir();
  const spd = rand(Math.min(P.startSpeed, P.startSpeedMax), Math.max(P.startSpeed, P.startSpeedMax));
  p.vel.copy(dir).multiplyScalar(spd);
  const ca = hexToRgb(P.startColorA);
  const cb = hexToRgb(P.startColorB);
  p.color = {
    r: ca.r + (cb.r - ca.r) * rnd(),
    g: ca.g + (cb.g - ca.g) * rnd(),
    b: ca.b + (cb.b - ca.b) * rnd(),
    a: 1
  };
  particles.push(p);
}

function updateSystem(dt) {
  simTime += dt * P.simulationSpeed;
  const total = P.duration;
  if (P.looping) {
    if (simTime > total) {
      simTime = simTime % total;
      if (P.burstCount > 0) sysElapsed = -1;
    }
  }

  /* 发射 */
  const emitting = P.looping || simTime <= P.duration;
  if (emitting) {
    emitAcc += P.rateOverTime * dt * P.simulationSpeed;
    while (emitAcc >= 1) {
      spawnParticle(simTime);
      emitAcc -= 1;
    }
  }

  /* Bursts（多组，按时间点精确触发） */
  {
    const burstList = normalizeBursts();
    const phase = P.looping ? (simTime % total) : Math.min(simTime, total);
    const prev = burstPhase;
    burstPhase = phase;
    if (emitting && burstList.length) {
      for (let bi = 0; bi < burstList.length; bi++) {
        const bt = burstList[bi];
        const n = bt[1];
        const cyc = bt[2];
        if (n <= 0) continue;
        const span = total / Math.max(1, cyc);
        for (let k = 0; k < cyc; k++) {
          const trig = bt[0] + k * span;
          if (trig > total + 1e-6) continue;
          let hit;
          if (prev < 0) hit = trig <= phase + 1e-9;
          else if (phase >= prev) hit = trig > prev && trig <= phase + 1e-9;
          else hit = trig > prev || trig <= phase + 1e-9;
          if (hit) { for (let i = 0; i < n; i++) spawnParticle(simTime); }
        }
      }
    }
  }

  /* 逐帧积分 */
  const alive = [];
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    p.age += dt * P.simulationSpeed;
    if (p.age >= p.life) continue;

    const r = clamp(p.age / p.life, 0, 1);

    if (P.velOn) {
      p.vel.x += P.velX * dt;
      p.vel.y += P.velY * dt;
      p.vel.z += P.velZ * dt;
      if (P.velRadial !== 0) {
        const n = p.pos.clone().normalize();
        p.vel.addScaledVector(n, P.velRadial * dt);
      }
      if (P.orbitalZ !== 0) {
        /* 绕 Z 轴旋转速度向量（等价 Unity 的 Orbital Z） */
        const a = P.orbitalZ * Math.PI / 180 * dt;
        const ca = Math.cos(a), sa = Math.sin(a);
        const vx = p.vel.x, vy = p.vel.y;
        p.vel.x = vx * ca - vy * sa;
        p.vel.y = vx * sa + vy * ca;
      }
    }

    p.vel.y += GRAVITY * P.gravityModifier * dt;

    if (P.forceOn) {
      p.vel.x += P.forceX * dt;
      p.vel.y += P.forceY * dt;
      p.vel.z += P.forceZ * dt;
    }

    if (P.noiseOn) {
      const f = P.noiseFrequency;
      const t = simTime * P.noiseScroll;
      const nx = Math.sin(p.pos.y * f + t + p.seedA) * Math.cos(p.pos.z * f + t);
      const ny = Math.sin(p.pos.z * f + t + p.seedB) * Math.cos(p.pos.x * f + t);
      const nz = Math.sin(p.pos.x * f + t + p.seedC) * Math.cos(p.pos.y * f + t);
      p.vel.x += nx * P.noiseStrength * dt;
      p.vel.y += ny * P.noiseStrength * dt;
      p.vel.z += nz * P.noiseStrength * dt;
    }

    if (P.limitOn) {
      const sp = p.vel.length();
      if (sp > P.limitSpeed) {
        const damp = clamp(P.limitDampen, 0, 1);
        p.vel.multiplyScalar(1 - damp);
      }
    }

    if (P.rotOn) p.rot += p.rotSpeed * dt;

    p.pos.addScaledVector(p.vel, dt * P.velSpeedMod * evalCurve(P.velSpeedCurve, r));

    /* 尺寸曲线 */
    const sMul = P.sizeOn ? evalCurve(P.sizeCurve, r) : 1;
    p.size = p.size0 * sMul;

    /* 颜色 */
    if (P.colOn) {
      const c = drawColor(r);
      p.color.r = c.r; p.color.g = c.g; p.color.b = c.b; p.color.a = c.a;
    }

    /* stretched 长度 */
    p.stretch = P.renderMode === 'stretched' ? 1 : 1;

    alive.push(p);
  }
  particles = alive;
}

function writeBuffers() {
  const n = Math.min(particles.length, MAX_P);
  for (let i = 0; i < n; i++) {
    const p = particles[i];
    iPos.array[i * 3] = p.pos.x;
    iPos.array[i * 3 + 1] = p.pos.y;
    iPos.array[i * 3 + 2] = p.pos.z;
    iSize.array[i * 2] = clampSize(p.size);
    iSize.array[i * 2 + 1] = p.stretch;
    iColor.array[i * 4] = p.color.r;
    iColor.array[i * 4 + 1] = p.color.g;
    iColor.array[i * 4 + 2] = p.color.b;
    iColor.array[i * 4 + 3] = p.color.a;
    iRot.array[i] = p.rot;
    iVel.array[i * 3] = p.vel.x;
    iVel.array[i * 3 + 1] = p.vel.y;
    iVel.array[i * 3 + 2] = p.vel.z;
  }
  iPos.needsUpdate = true;
  iSize.needsUpdate = true;
  iColor.needsUpdate = true;
  iRot.needsUpdate = true;
  iVel.needsUpdate = true;
  quadGeo.instanceCount = n;
}

function applyTransform() {
  outline.visible = false;
  if (!GROUPS.length) {
    particleRoot.position.set(P.posX, P.posY, P.posZ);
    particleRoot.rotation.set(P.rotX * Math.PI / 180, P.rotY * Math.PI / 180, P.rotZ * Math.PI / 180);
    particleRoot.scale.set(P.scaleX, P.scaleY, P.scaleZ);
    return;
  }
  for (let i = 0; i < GROUPS.length; i++) applyGroupTransform(GROUPS[i]);
  const g = GROUPS[gActive];
  if (g) updateWire(g);
}

function applyGroupTransform(g) {
  const PP = g.P;
  g.holder.position.set(PP.posX, PP.posY, PP.posZ);
  g.holder.rotation.set(PP.rotX * Math.PI / 180, PP.rotY * Math.PI / 180, PP.rotZ * Math.PI / 180);
  g.holder.scale.set(PP.scaleX, PP.scaleY, PP.scaleZ);
  updateWire(g);
}

function normalizeBursts() {
  if (!Array.isArray(P.bursts)) P.bursts = [];
  if (!P.bursts.length && P.burstCount > 0) {
    P.bursts = [[Number(P.burstTime) || 0, Math.round(P.burstCount), Math.max(1, Math.round(P.burstCycles || 1))]];
    P.burstCount = 0;
  }
  P.bursts = P.bursts.map(function (b) {
    return [Math.max(0, Number(b[0]) || 0), Math.max(0, Math.round(Number(b[1]) || 0)), Math.max(1, Math.round(Number(b[2]) || 1))];
  });
  return P.bursts;
}

function resetSystem() {
  reseed(P.randomSeed);
  particles.length = 0; pool.length = 0;
  emitAcc = 0; simTime = 0; sysElapsed = -1; burstPhase = -1; seedCounter = 1;
  quadGeo.instanceCount = 0;
}

   6. 面板构建

const groupsEl = document.getElementById('groups');
const uiRefs = {};

function makeSec(title, en, key) {

/* 数值行：滑块 + 可键盘输入的输入框 */
/* ---------- 数值拖拽（Unity 式 scrubbing）：按住左右拖改值，单击仍可键盘输入 ---------- */
let scrubState = null;
window.addEventListener('mousemove', function (e) {
  const s = scrubState;
  if (!s) return;
  const dx = e.clientX - s.startX;
  if (!s.active) {
    if (Math.abs(dx) < 3) return;
    s.active = true;
    document.body.classList.add('scrubbing');
    try { window.getSelection().removeAllRanges(); } catch (err) {}
    s.inp.blur();
  }
  const mult = e.shiftKey ? 10 : (e.altKey ? 0.1 : 1);
  const v = clamp(s.base + dx * parseFloat(s.step) * mult, parseFloat(s.min), parseFloat(s.max));
  s.apply(v);
});
window.addEventListener('mouseup', function () {
  if (scrubState && scrubState.active) document.body.classList.remove('scrubbing');
  scrubState = null;
});

function attachScrub(inp, step, min, max, apply) {
  inp.addEventListener('mousedown', function (e) {
    if (e.button !== 0) return;
    let b = parseFloat(inp.value);
    if (!isFinite(b)) b = 0;
    scrubState = { inp: inp, startX: e.clientX, base: b, step: step, min: min, max: max, apply: apply, active: false };
  });
}

/* ---------- 成对参数的“固定值”开关 ---------- */
const PAIR_MAP = {};
const PAIR_REV = {};
const valueLocks = {};

function setValueLock(minKey, on) {
  valueLocks[minKey] = !!on;
  const mx = PAIR_MAP[minKey];
  if (on && mx) { P[mx] = P[minKey]; onParamChange(mx); }
  applyValueLockUI();
  syncPairedUI(minKey);
}

function applyValueLockUI() {
  for (const a in PAIR_MAP) {
    const b = PAIR_MAP[a];
    const ra = uiRefs[a], rb = uiRefs[b];
    if (ra && ra.row) ra.row.classList.toggle('locked', !!valueLocks[a]);
    if (rb && rb.row) rb.row.style.display = valueLocks[a] ? 'none' : '';
  }
}

function syncPairedUI(key) {
  let other = PAIR_MAP[key] || null;
  if (!other && PAIR_REV[key] && valueLocks[PAIR_REV[key]]) other = PAIR_REV[key];
  if (!other) return;
  const r = uiRefs[other];
  if (!r) return;
  if (r.rng) r.rng.value = P[other];
  if (r.num) r.num.value = fmt(P[other], r.step);
}

function numRow(body, label, key, min, max, step, hint, pairKey) {
  const row = document.createElement('div'); row.className = 'row';
  const lab = document.createElement('label'); lab.textContent = label; if (hint) lab.title = hint;
  if (pairKey) {
    PAIR_MAP[key] = pairKey;
    PAIR_REV[pairKey] = key;
    const lk = document.createElement('button');
    lk.type = 'button'; lk.className = 'lockbtn'; lk.textContent = '\u21d4';
    lk.title = 'Lock: keep min and max identical (click to toggle)';
    lk.addEventListener('click', function (e) {
      e.preventDefault(); e.stopPropagation();
      setValueLock(key, !valueLocks[key]);
    });
    lab.appendChild(lk);
  }
  row.appendChild(lab);
  const rng = document.createElement('input');
  rng.type = 'range'; rng.min = min; rng.max = max; rng.step = step;
  row.appendChild(rng);
  const num = document.createElement('input');
  num.type = 'number'; num.className = 'num'; num.min = min; num.max = max; num.step = step;
  row.appendChild(num);

  const commit = function (v, fromNum) {
    let val = parseFloat(v);
    if (!isFinite(val)) val = P[key];
    val = clamp(val, parseFloat(min), parseFloat(max));
    P[key] = val;
    /* 只有点了「固定值」开关（valueLocks）时才联动另一端；
       普通拖动最小值不得改写最大值，反之亦然 */
    if (pairKey && valueLocks[key]) P[pairKey] = val;
    if (PAIR_REV[key] && valueLocks[PAIR_REV[key]]) P[PAIR_REV[key]] = val;
    rng.value = val;
    num.value = fmt(val, step);
    onParamChange(key);
    if (pairKey && valueLocks[key]) onParamChange(pairKey);
    if (PAIR_REV[key] && valueLocks[PAIR_REV[key]]) onParamChange(PAIR_REV[key]);
    syncPairedUI(key);
  };

  rng.addEventListener('input', function () { commit(rng.value, false); });
  num.addEventListener('change', function () { commit(num.value, true); });
  num.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { commit(num.value, true); num.blur(); }
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      e.preventDefault();
      const dir = e.key === 'ArrowUp' ? 1 : -1;
      commit(parseFloat(num.value || 0) + dir * parseFloat(step), true);
    }
  });
  num.addEventListener('focus', function () { num.select(); });
  attachScrub(num, step, min, max, function (v) { commit(v, true); });
  attachScrub(rng, step, min, max, function (v) { commit(v, true); });
  body.appendChild(row);
  uiRefs[key] = { type: 'num', rng: rng, num: num, step: step, min: min, max: max, row: row };
  return row;
}

/* ---------- 曲线编辑控件：可视化 + 拖动控制点 ---------- */
function curveRow(body, label, key, opt) {
  opt = opt || {};
  const vmax = opt.vmax || 2;
  const W = 236, H = 78, DPR = 2;
  const row = document.createElement('div');
  row.className = 'row curve';
  const lab = document.createElement('label');
  lab.textContent = label;
  row.appendChild(lab);
  const box = document.createElement('div');
  box.className = 'curvebox';
  const cv = document.createElement('canvas');
  cv.className = 'curvecv';
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  box.appendChild(cv);
  row.appendChild(box);
  body.appendChild(row);
  const ctx = cv.getContext('2d');

  function pts() {
    if (!Array.isArray(P[key]) || !P[key].length) P[key] = [[0, 1], [1, 1]];
    return P[key];
  }
  const PAD = 6;
  function X(t) { return PAD + t * (W - PAD * 2); }
  function Y(v) { return H - PAD - clamp(v / vmax, -0.1, 1.1) * (H - PAD * 2); }
  function tOf(px) { return clamp((px - PAD) / (W - PAD * 2), 0, 1); }
  function vOf(py) { return Math.round(clamp((H - PAD - py) / (H - PAD * 2), 0, 1.1) * vmax * 100) / 100; }

  let dragIdx = -1;
  function draw() {
    const arr = pts();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(255,255,255,0.07)';
    ctx.lineWidth = 1;
    for (let i = 1; i < 4; i++) {
      const y = PAD + (H - PAD * 2) * i / 4;
      ctx.beginPath(); ctx.moveTo(PAD, y); ctx.lineTo(W - PAD, y); ctx.stroke();
    }
    for (let i = 1; i < 4; i++) {
      const x = PAD + (W - PAD * 2) * i / 4;
      ctx.beginPath(); ctx.moveTo(x, PAD); ctx.lineTo(x, H - PAD); ctx.stroke();
    }
    ctx.beginPath();
    for (let i = 0; i <= 72; i++) {
      const t = i / 72;
      const x = X(t), y = Y(evalCurve(arr, t));
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = 'rgba(120,200,255,0.95)';
    ctx.lineWidth = 1.7;
    ctx.stroke();
    for (let i = 0; i < arr.length; i++) {
      ctx.beginPath();
      ctx.arc(X(arr[i][0]), Y(arr[i][1]), i === dragIdx ? 4.4 : 3.2, 0, Math.PI * 2);
      ctx.fillStyle = i === dragIdx ? '#9fe8ff' : '#d8f2ff';
      ctx.fill();
    }
  }
  function local(e) {
    const r = cv.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function pick(m) {
    const arr = pts();
    let best = -1, bd = 13;
    for (let i = 0; i < arr.length; i++) {
      const dx = X(arr[i][0]) - m.x, dy = Y(arr[i][1]) - m.y;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < bd) { bd = d; best = i; }
    }
    return best;
  }
  function commit() {
    if (opt.presetKey && uiRefs[opt.presetKey]) {
      P[opt.presetKey] = 'custom';
      uiRefs[opt.presetKey].sel.value = 'custom';
    }
    onParamChange(key);
  }
  function onMove(e) {
    if (dragIdx < 0) return;
    const arr = pts(), m = local(e);
    const i = dragIdx;
    const lo = i === 0 ? 0 : arr[i - 1][0] + 0.02;
    const hi = i === arr.length - 1 ? 1 : arr[i + 1][0] - 0.02;
    if (i === 0) arr[i][0] = 0;
    else if (i === arr.length - 1) arr[i][0] = 1;
    else arr[i][0] = clamp(tOf(m.x), lo, hi);
    arr[i][1] = vOf(m.y);
    draw();
    commit();
  }
  function onUp() {
    dragIdx = -1;
    window.removeEventListener('mousemove', onMove);
    window.removeEventListener('mouseup', onUp);
    draw();
  }
  cv.addEventListener('mousedown', function (e) {
    if (e.button !== 0) return;
    e.preventDefault();
    const m = local(e);
    let i = pick(m);
    if (i < 0) {
      const arr = pts();
      arr.push([tOf(m.x), vOf(m.y)]);
      arr.sort(function (a, b) { return a[0] - b[0]; });
      i = arr.indexOf(arr.filter(function (q) { return q[0] === tOf(m.x) && q[1] === vOf(m.y); })[0]);
      if (i < 0) i = arr.length - 1;
      commit();
    }
    dragIdx = i;
    draw();
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
  });
  cv.addEventListener('contextmenu', function (e) {
    e.preventDefault();
    const arr = pts();
    if (arr.length <= 2) return;
    const i = pick(local(e));
    if (i > 0 && i < arr.length - 1) {
      arr.splice(i, 1);
      draw();
      commit();
    }
  });
  cv.title = 'Drag the control points to edit the curve: click empty space to add a point, right-click a middle point to delete it';

  uiRefs[key] = { type: 'curve', draw: draw };
  draw();
}

function fmt(v, step) {
  const st = String(step);
  const dec = st.indexOf('.') >= 0 ? st.split('.')[1].length : 0;
  return Number(v).toFixed(dec);
}

/* 三轴行 */
function vecRow(body, label, keys, min, max, step) {
  const row = document.createElement('div');
  row.className = 'row vec';
  const lab = document.createElement('label');
  lab.textContent = label;
  row.appendChild(lab);
  const wrap = document.createElement('div');
  wrap.className = 'vec3';
  const axes = ['x', 'y', 'z'];
  const refs = [];
  for (let i = 0; i < 3; i++) {
    const cell = document.createElement('div');
    cell.className = 'axiscell';
    const tag = document.createElement('span');
    tag.className = 'axis a' + axes[i];
    tag.textContent = axes[i].toUpperCase();
    const inp = document.createElement('input');
    inp.type = 'number';
    inp.className = 'num';
    inp.min = min; inp.max = max; inp.step = step;
    cell.appendChild(tag); cell.appendChild(inp);
    wrap.appendChild(cell);
    refs.push(inp);
    const k = keys[i];
    const commit = function (v) {
      let val = parseFloat(v);
      if (!isFinite(val)) val = P[k];
      val = clamp(val, parseFloat(min), parseFloat(max));
      P[k] = val;
      inp.value = fmt(val, step);
      onParamChange(k);
    };
    inp.addEventListener('change', function () { commit(inp.value); });
    inp.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { commit(inp.value); inp.blur(); }
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        e.preventDefault();
        const d = (e.key === 'ArrowUp' ? 1 : -1) * parseFloat(step);
        commit(clamp(parseFloat(inp.value || 0) + d, parseFloat(min), parseFloat(max)));
      }
    });
    inp.addEventListener('focus', function () { inp.select(); });
    attachScrub(inp, step, min, max, function (v) { commit(v); });
  }
  row.appendChild(wrap);
  body.appendChild(row);
  for (let i = 0; i < 3; i++)
    uiRefs[keys[i]] = { type: 'num', num: refs[i], step: step, min: min, max: max, row: row };
  return row;
}

  row.appendChild(lab);

  row.appendChild(hex);
  col.addEventListener('input', function () {
    P[key] = col.value;

    onParamChange(key);
  });
  hex.addEventListener('change', function () {

      P[key] = v.toLowerCase();
      col.value = P[key];

      onParamChange(key);

  });

  uiRefs[key] = { type: 'color', col: col, hex: hex };
  return row;
